/* ---- 서버 전송 ---- */
async function sendLead(payload){
  if(!GTI.endpoint){
    try{
      const box = JSON.parse(localStorage.getItem(GTI.storeKey+'_rows') || '[]');
      box.push(payload);
      localStorage.setItem(GTI.storeKey+'_rows', JSON.stringify(box));
    }catch(e){}
    console.warn('[GTI] endpoint 미설정 — 브라우저에만 임시 저장되었습니다.', payload);
    return true;
  }
  await fetch(GTI.endpoint, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return true;
}

/* ---- 신청 폼 열기 ---- */
function openLeadForm(opt={}){
  const {
    title = '📮 네트워킹 초대 신청',
    lead  = 'HR 실무자 네트워킹 행사와 세미나 소식을<br>가장 먼저 받아보세요.',
    cta   = '신청하기',
    allowSkip = true,
    source = 'title',
    onDone = null
  } = opt;

  const html = `
  <div class="lead-panel">
    <h2 class="lead-title">${title}</h2>
    <div class="lead-lead">${lead}</div>

    <div class="lead-field">
      <label for="ld_company">회사명<span class="req">*</span></label>
      <input id="ld_company" type="text" autocomplete="organization" placeholder="예) 좋은인재연구소" maxlength="60">
    </div>
    <div class="lead-field">
      <label for="ld_name">이름<span class="req">*</span></label>
      <input id="ld_name" type="text" autocomplete="name" placeholder="예) 홍길동" maxlength="30">
    </div>
    <div class="lead-field">
      <label for="ld_phone">연락처<span class="req">*</span></label>
      <input id="ld_phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678" maxlength="14">
    </div>
    <div class="lead-field">
      <label for="ld_email">이메일<span class="req">*</span></label>
      <input id="ld_email" type="email" inputmode="email" autocomplete="email" placeholder="hr@company.com" maxlength="80">
    </div>
    <input class="hp-trap" id="ld_hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="consent-box">
      <div class="consent-row consent-all">
        <input type="checkbox" id="ld_all">
        <label for="ld_all">아래 내용에 모두 동의합니다</label>
      </div>
      <div class="consent-row">
        <input type="checkbox" id="ld_privacy">
        <label for="ld_privacy">
          <span class="tag-req">[필수]</span> 개인정보 수집·이용에 동의합니다
          <button type="button" class="detail-toggle" data-target="ld_privacy_d">전문 보기</button>
          <div class="detail-body" id="ld_privacy_d">${CONSENT_TEXT.privacy}</div>
        </label>
      </div>
      <div class="consent-row">
        <input type="checkbox" id="ld_mkt">
        <label for="ld_mkt">
          <span class="tag-opt">[선택]</span> 행사·교육 등 광고성 정보 수신에 동의합니다
          <button type="button" class="detail-toggle" data-target="ld_mkt_d">전문 보기</button>
          <div class="detail-body" id="ld_mkt_d">${CONSENT_TEXT.marketing}</div>
        </label>
      </div>
    </div>
    <div class="lead-msg" id="ld_err"></div>
    <div class="lead-note">입력하신 정보는 ${GTI.org}의 행사 안내 목적으로만 사용되며,<br>동의 철회 시 즉시 파기됩니다.</div>

    <div class="lead-btns">
      <button class="panel-btn" id="ld_submit">${cta}</button>
      ${allowSkip ? '<button class="panel-btn secondary" id="ld_skip">다음에 할게요</button>' : ''}
    </div>
  </div>`;

  let ov = document.getElementById('overlayPanel');
  if(ov) ov.remove();
  ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'overlayPanel';
  ov.innerHTML = `<div class="panel">${html}</div>`;
  document.body.appendChild(ov);

  const $ = id => document.getElementById(id);
  const finish = () => { closePanel(); if(onDone) onDone(); };

  ov.querySelectorAll('.detail-toggle').forEach(btn=>{
    btn.onclick = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const box = $(btn.dataset.target);
      box.classList.toggle('show');
      btn.textContent = box.classList.contains('show') ? '접기' : '전문 보기';
    };
  });

  const boxes = [$('ld_privacy'), $('ld_mkt')];
  $('ld_all').onchange = e => boxes.forEach(b => b.checked = e.target.checked);
  boxes.forEach(b => b.onchange = () => { $('ld_all').checked = boxes.every(x => x.checked); });

  $('ld_phone').oninput = e => {
    let v = e.target.value.replace(/[^0-9]/g,'').slice(0,11);
    if(v.length>7) v = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7);
    else if(v.length>3) v = v.slice(0,3)+'-'+v.slice(3);
    e.target.value = v;
  };

  const showErr = (msg, focusId) => {
    const el = $('ld_err');
    el.textContent = msg; el.classList.add('show');
    ov.querySelectorAll('input').forEach(i=>i.classList.remove('err'));
    if(focusId){ $(focusId).classList.add('err'); $(focusId).focus(); }
  };

  if(allowSkip && $('ld_skip')){
    $('ld_skip').onclick = () => finish();
  }

  $('ld_submit').onclick = async () => {
    const company = $('ld_company').value.trim();
    const name    = $('ld_name').value.trim();
    const phone   = $('ld_phone').value.trim();
    const email   = $('ld_email').value.trim();

    if($('ld_hp').value) return finish();                       // 봇 차단
    if(!company)                    return showErr('회사명을 입력해 주세요.', 'ld_company');
    if(name.length < 2)             return showErr('이름을 2자 이상 입력해 주세요.', 'ld_name');
    if(!/^01[0-9]-\d{3,4}-\d{4}$/.test(phone))
                                    return showErr('연락처를 010-1234-5678 형식으로 입력해 주세요.', 'ld_phone');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))
                                    return showErr('이메일 주소를 정확히 입력해 주세요.', 'ld_email');
    if(!$('ld_privacy').checked)    return showErr('개인정보 수집·이용(필수)에 동의해 주세요.');

    const btn = $('ld_submit');
    btn.disabled = true; btn.textContent = '전송 중...';
    const payload = {
      company, name, phone, email,
      agreePrivacy: 'Y',
      agreeMarketing: $('ld_mkt').checked ? 'Y' : 'N',
      source,
      act: (typeof G !== 'undefined' && G.act) ? G.act : '',
      submittedAt: new Date().toISOString()
    };
    try{
      await sendLead(payload);
      closePanel();
      showPanel({
        title:'✅ 신청 완료',
        desc:`${name}님, 신청해 주셔서 감사합니다.<br>${GTI.org}의 네트워킹 행사 소식을<br>입력하신 이메일로 보내드릴게요.`,
        buttons:[{label:'계속하기', cls:'panel-btn', onClick:()=>{ closePanel(); if(onDone) onDone(); }}]
      });
    }catch(err){
      btn.disabled = false; btn.textContent = cta;
      showErr('전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    }
  };

  setTimeout(()=>{ const c=$('ld_company'); if(c) c.focus({preventScroll:true}); }, 120);
}

document.getElementById('soundToggleBtn').onclick=()=>{
  SND.ensureCtx();
  const btn=document.getElementById('soundToggleBtn');
  if(!SND.hasStarted()){
    SND.setMuted(false);
    SND.playIntro();
    btn.textContent='🔊'; btn.classList.remove('muted');
    return;
  }
  const nowMuted = !SND.isMuted();
  SND.setMuted(nowMuted);
  btn.textContent = nowMuted?'🔇':'🔊';
  btn.classList.toggle('muted', nowMuted);
};
function _unlockAudioOnce(){
  if(!SND.hasStarted()) SND.playIntro();
  document.removeEventListener('click', _unlockAudioOnce);
  document.removeEventListener('touchstart', _unlockAudioOnce);
}
document.addEventListener('click', _unlockAudioOnce, {once:true});
document.addEventListener('touchstart', _unlockAudioOnce, {once:true});
newGame();
renderTitle();
