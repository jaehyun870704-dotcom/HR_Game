<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>소소의 모험</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root{
  --forest-deep:#16311F;
  --forest-mid:#2F5B36;
  --forest-dark:#0F2417;
  --path-tan:#D9C08C;
  --path-tan-dark:#B79A5E;
  --parchment:#EFE1BC;
  --parchment-dark:#DDC896;
  --ink:#2B1B12;
  --mustard:#E8A93C;
  --mustard-dark:#C98A28;
  --ember:#B23A24;
  --ember-dark:#8A2A19;
  --moss:#8FBF5C;
  --moss-dark:#5B8C3A;
  --gold:#F0C766;
  --purple:#8B5FBF;
  --blue:#5C8FBF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--forest-dark);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
.pixel{font-family:'Press Start 2P',monospace;}
#app{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
}
button{
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  border:none;
  outline:none;
}
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--mustard-dark); border-radius:4px;}

/* ---------- 공통 ---------- */
.screen{width:100%; max-width:520px; min-height:100vh; position:relative; margin:0 auto;}
.hidden{display:none !important;}
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--gold); padding:10px 18px; border-radius:8px;
  font-size:13px; font-weight:700; z-index:999; box-shadow:0 4px 12px rgba(0,0,0,.4);
  border:2px solid var(--gold); opacity:0; transition:opacity .25s, top .25s;
  pointer-events:none; text-align:center; max-width:88%;
}
.toast.show{opacity:1; top:24px;}
.sound-toggle{
  position:fixed; top:12px; right:12px; z-index:998;
  width:38px; height:38px; border-radius:50%; border:2px solid var(--ink);
  background:var(--parchment-dark); font-size:16px; line-height:1; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;
}
.sound-toggle.muted{ opacity:.55; }

/* ---------- 타이틀 ---------- */
.title-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 50% 20%, #1f4a2c 0%, var(--forest-deep) 55%, var(--forest-dark) 100%);
  padding:24px; text-align:center; gap:6px;
}
.title-badge{
  font-size:11px; letter-spacing:2px; color:var(--gold); opacity:.85; margin-bottom:10px;
}
.title-main{
  font-size:32px; color:var(--mustard); text-shadow:3px 3px 0 var(--ink), 0 0 24px rgba(232,169,60,.35);
  line-height:1.5; margin:0 0 18px;
}
.title-sub{ color:var(--path-tan); font-size:13px; margin-bottom:34px; line-height:1.8; opacity:.9;}
.soso-title-wrap{ margin-bottom:28px; filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
.btn-primary{
  background:linear-gradient(180deg,var(--mustard),var(--mustard-dark));
  color:var(--ink); font-weight:900; font-size:16px; padding:16px 42px; border-radius:10px;
  border-bottom:4px solid #9a6a1c; box-shadow:0 4px 0 rgba(0,0,0,.25);
  transition:transform .08s;
}
.btn-primary:active{ transform:translateY(3px); border-bottom-width:1px;}
.btn-secondary{
  margin-top:14px; background:transparent; color:var(--path-tan); font-size:12px;
  text-decoration:underline; padding:8px;
}
.topic-list{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:380px; margin-top:22px;}
.topic-chip{
  font-size:10px; background:rgba(217,192,140,.12); border:1px solid var(--path-tan-dark);
  color:var(--path-tan); padding:5px 9px; border-radius:20px;
}

/* ---------- 지도 화면 ---------- */
.map-screen{ min-height:100vh; background:
    linear-gradient(180deg, var(--forest-dark) 0%, var(--forest-deep) 8%, var(--forest-mid) 100%);
  padding-bottom:40px; position:relative;
}
.map-header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:linear-gradient(180deg,rgba(15,36,23,.97),rgba(15,36,23,.75) 80%,transparent);
}
.act-label{ font-size:11px; color:var(--gold); }
.act-title{ font-size:15px; color:var(--parchment); font-weight:900; margin-top:2px;}
.hp-pill{
  display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.35); border:1px solid var(--ember);
  border-radius:20px; padding:6px 12px;
}
.hp-pill .heart{color:var(--ember); font-size:14px;}
.hp-pill .val{font-size:12px; font-weight:900; color:var(--parchment);}
.map-scroll{ position:relative; padding:20px 12px 10px; }
.map-svg{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;}
.map-row{ display:flex; justify-content:center; gap:34px; margin-bottom:64px; position:relative; z-index:2; }
.node-btn{
  width:64px; height:64px; border-radius:14px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; position:relative; transition:transform .15s, filter .15s;
  background:var(--path-tan); border:3px solid var(--path-tan-dark);
  box-shadow:0 4px 0 rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.15);
}
.node-btn .ic{font-size:24px;}
.node-btn .lv{font-size:8px; color:var(--ink); opacity:.6; margin-top:1px;}
.node-btn.locked{ filter:grayscale(.9) brightness(.45); cursor:default; }
.node-btn.reachable{ cursor:pointer; animation:pulseNode 1.8s ease-in-out infinite; }
.node-btn.reachable:hover{ transform:translateY(-4px) scale(1.05); }
.node-btn.done{ filter:brightness(.6) saturate(.5); cursor:default; }
.node-btn.boss{ width:78px; height:78px; background:var(--ember); border-color:var(--ember-dark); }
.node-btn.boss .ic{font-size:32px;}
@keyframes pulseNode{ 0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 0 0 rgba(240,199,102,.6);} 50%{box-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 0 10px rgba(240,199,102,0);} }
.player-token{
  position:absolute; width:36px; height:36px; z-index:5; pointer-events:none;
  transition:top .5s ease, left .5s ease; transform:translate(-50%,-115%);
  animation:tokenBob 1.6s ease-in-out infinite;
}
.player-token img{
  width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
  box-shadow:0 0 0 4px rgba(232,169,60,.35), 0 4px 6px rgba(0,0,0,.45);
}
@keyframes tokenBob{ 0%,100%{ margin-top:0; } 50%{ margin-top:-4px; } }
.map-legend{
  display:flex; justify-content:center; gap:10px; flex-wrap:wrap; padding:10px 16px 0; font-size:9px; color:var(--path-tan);
}
.map-legend span{ display:flex; align-items:center; gap:3px; }
.kills-hint{
  text-align:center; font-size:10px; color:var(--gold); background:rgba(0,0,0,.25); margin:8px 16px 0;
  padding:6px 10px; border-radius:8px; border:1px solid rgba(240,199,102,.3);
}
.node-btn.locked .ic{ filter:saturate(.3); }

/* ---------- 인벤토리 바 ---------- */
.inv-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center; gap:8px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom)); background:rgba(15,36,23,.95);
  border-top:2px solid var(--mustard-dark); max-width:520px; margin:0 auto;
}
.inv-slot{
  width:38px; height:38px; border-radius:8px; background:rgba(217,192,140,.1); border:1px dashed var(--path-tan-dark);
  display:flex; align-items:center; justify-content:center; font-size:18px; position:relative;
}
.inv-slot.filled{ background:rgba(232,169,60,.15); border:1px solid var(--mustard);}
.inv-slot .rarity-dot{ position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%;}

/* ---------- 전투 화면 (Game Boy 포켓몬 스타일 레이아웃) ---------- */
.battle-screen{ min-height:100vh; display:flex; flex-direction:column;
  background:
   radial-gradient(ellipse at 50% 0%, #2a4d2f 0%, var(--forest-deep) 60%),
   var(--forest-dark);
  padding-bottom:min(46vh, 232px);
}
.battle-topbar{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; }
.act-chip{ font-size:9px; color:var(--gold); background:rgba(0,0,0,.3); padding:4px 8px; border-radius:6px;}
.combo-chip{ font-size:10px; color:var(--parchment); background:rgba(0,0,0,.3); padding:4px 8px; border-radius:6px; display:flex; align-items:center; gap:4px;}
.combo-chip b{color:var(--gold); font-size:12px;}

/* 전투 무대: 4분면 절대배치 (좌상 적정보 / 우상 적스프라이트 / 좌하 소소스프라이트 / 우하 소소정보) */
.arena{
  position:relative; width:100%; max-width:480px; margin:0 auto;
  aspect-ratio:16/12; min-height:220px; max-height:46vh;
  padding:0; overflow:hidden;
}
.arena::after{ content:''; position:absolute; left:6%; right:6%; bottom:6%; height:14px; background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent 70%);}

/* 정보창(적/플레이어 공통) — GB식 흰 박스 + 굵은 테두리 */
.enemy-infobox, .player-infobox{
  position:absolute; z-index:6; background:var(--parchment); border:3px solid var(--ink); border-radius:8px;
  padding:6px 9px 7px; box-shadow:0 3px 0 rgba(0,0,0,.28); max-width:60%; min-width:118px;
}
.enemy-infobox{ top:3%; left:3%; }
.player-infobox{ bottom:22%; right:3%; text-align:right; }
.ib-toprow{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
.player-infobox .ib-toprow{ flex-direction:row-reverse; }
.ib-name{ font-size:11.5px; font-weight:900; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ib-lv{ font-size:9px; color:#6b5a3e; font-weight:800; flex-shrink:0;}
.ib-hp-row{ display:flex; align-items:center; gap:5px; }
.player-infobox .ib-hp-row{ flex-direction:row-reverse; }
.ib-hp-label{ font-size:7.5px; color:var(--ink); flex-shrink:0; }
.ib-hp-num{ font-size:9.5px; color:var(--ink); text-align:right; margin-top:3px; font-weight:800;}

.monster-hpbar, .player-hpbar{
  width:100px; height:11px; background:#1b1210; border:2px solid var(--ink); border-radius:5px; overflow:hidden;
  position:relative; box-shadow:inset 0 2px 3px rgba(0,0,0,.6); flex:1;
}
.monster-hpbar-fill{ height:100%; background:linear-gradient(180deg,#8fe15a,var(--moss-dark)); transition:width .4s ease, background .3s; }
.player-hpbar-fill{ height:100%; background:linear-gradient(180deg,#8fe15a,var(--moss-dark)); transition:width .4s ease, background .3s; }
.player-infobox.low-hp .player-hpbar-fill{ background:linear-gradient(180deg,#ff8a6a,var(--ember)); }
.player-infobox.low-hp .ib-hp-num{ color:var(--ember-dark); animation:lowHpBlink 1s ease-in-out infinite; }
.player-infobox.low-hp{ animation:lowHpBorder 1s ease-in-out infinite; }
@keyframes lowHpBlink{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
@keyframes lowHpBorder{ 0%,100%{ box-shadow:0 3px 0 rgba(0,0,0,.28);} 50%{ box-shadow:0 3px 0 rgba(0,0,0,.28), 0 0 0 4px rgba(178,58,36,.55);} }

.soso-slot{ position:absolute; left:2%; bottom:2%; z-index:5; }
.monster-slot{ position:absolute; right:4%; top:16%; z-index:4; display:flex; flex-direction:column; align-items:center; }
.monster-frame{
  width:clamp(84px,24vw,116px); height:clamp(84px,24vw,116px); border-radius:16px;
  background:linear-gradient(180deg,var(--parchment-dark),var(--path-tan));
  border:3px solid var(--ink); display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 0 rgba(0,0,0,.3); position:relative; transition:transform .12s;
}
#monsterCanvas{ width:88%; height:88%; filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; }
.monster-frame.shake{ animation:shakeM .3s; }
.monster-frame.dying{ animation:dying .5s forwards; }
@keyframes shakeM{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px) rotate(-3deg);} 75%{transform:translateX(8px) rotate(3deg);} }
@keyframes dying{ to{ transform:scale(0) rotate(30deg); opacity:0;} }
.dmg-pop{
  position:absolute; font-size:18px; color:#e03131; text-shadow:2px 2px 0 var(--ink); pointer-events:none;
  animation:popUp .8s ease forwards; z-index:10; font-family:'Press Start 2P',monospace;
}
.dmg-pop.miss{ color:#aaa; }
@keyframes popUp{ 0%{opacity:0; transform:translateY(0) scale(.6);} 15%{opacity:1; transform:translateY(-10px) scale(1.1);} 100%{opacity:0; transform:translateY(-52px) scale(1);} }
.hit-flash{ position:absolute; inset:0; border-radius:50%; background:rgba(217,42,42,.45); pointer-events:none; z-index:6; animation:hitFlashFade .35s ease forwards; }
@keyframes hitFlashFade{ 0%{opacity:1;} 100%{opacity:0;} }

#sosoCanvas{
  width:clamp(96px,28vw,132px); height:clamp(96px,28vw,132px); border-radius:50%; object-fit:cover; display:block;
  border:3px solid var(--mustard-dark); box-shadow:0 6px 6px rgba(0,0,0,.4), 0 0 0 4px rgba(232,169,60,.25);
  transition:transform .15s ease, filter .15s ease;
}
#sosoCanvas.soso-pose-attack{ transform:translateX(10px) scale(1.06); filter:brightness(1.15) drop-shadow(0 6px 6px rgba(0,0,0,.4)); }
#sosoCanvas.soso-pose-hit{ animation:sosoHitShake .35s ease; filter:brightness(1.3) saturate(1.3) drop-shadow(0 6px 6px rgba(0,0,0,.4)); }
#sosoCanvas.soso-pose-victory{ animation:sosoVictoryBounce .6s ease; }
@keyframes sosoHitShake{
  0%{transform:translateX(0) scale(1,1) rotate(0);}
  15%{transform:translateX(-8px) scale(.92,1.08) rotate(-6deg);}
  40%{transform:translateX(7px) scale(1.05,.93) rotate(5deg);}
  65%{transform:translateX(-4px) scale(.97,1.03) rotate(-2deg);}
  100%{transform:translateX(0) scale(1,1) rotate(0);}
}
@keyframes sosoVictoryBounce{ 0%{transform:translateY(0) scale(1);} 30%{transform:translateY(-14px) scale(1.08);} 60%{transform:translateY(0) scale(1);} 80%{transform:translateY(-6px);} 100%{transform:translateY(0);} }
@media (max-width:360px){
  .enemy-infobox, .player-infobox{ padding:5px 7px 6px; min-width:104px; }
  .ib-name{ font-size:10.5px; }
  .monster-hpbar, .player-hpbar{ width:80px; height:10px; }
}

/* ---------- 하단 문제 패널 ---------- */
.quiz-dock{
  position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; z-index:40;
  background:var(--parchment); border-top:4px solid var(--ink); border-radius:18px 18px 0 0;
  box-shadow:0 -8px 24px rgba(0,0,0,.4); padding:12px 14px calc(12px + env(safe-area-inset-bottom));
}
.timer-track{ height:8px; background:#c8b384; border-radius:4px; overflow:hidden; margin-bottom:10px; border:1px solid var(--ink);}
.timer-fill{ height:100%; background:var(--moss-dark); transition:width .12s linear, background .3s; }
.timer-fill.warn{ background:var(--ember); }
.quiz-topic{ font-size:10px; color:var(--mustard-dark); font-weight:700; margin-bottom:3px;}
.quiz-q{ font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.5; margin-bottom:10px; min-height:44px;}
.quiz-options{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
.opt-btn{
  background:#fff9ec; border:2px solid var(--parchment-dark); border-radius:10px; padding:10px 8px;
  font-size:12.5px; font-weight:600; text-align:left; line-height:1.35; color:var(--ink); transition:all .15s;
  display:flex; gap:6px;
}
.opt-btn .num{ color:var(--mustard-dark); font-weight:900; flex-shrink:0;}
.opt-btn:not(:disabled):active{ transform:scale(.97); }
.opt-btn:disabled{ cursor:default; }
.opt-btn.correct{ background:var(--moss); border-color:var(--moss-dark); color:#0d2b06;}
.opt-btn.wrong{ background:#e8a794; border-color:var(--ember); color:var(--ember-dark);}
.opt-btn.eliminated{ opacity:.25; text-decoration:line-through; }
.explain-box{
  font-size:11.5px; background:rgba(0,0,0,.05); border-radius:8px; padding:8px 10px; color:#5a4a34;
  margin-bottom:8px; line-height:1.5; display:none;
}
.explain-box.show{ display:block; }
.dock-actions{ display:flex; gap:8px; align-items:center; }
.skill-btn{
  font-size:10.5px; background:rgba(139,95,191,.12); border:1.5px solid var(--purple); color:#5b3f80;
  padding:7px 10px; border-radius:8px; font-weight:700; display:flex; align-items:center; gap:4px;
}
.skill-btn:disabled{ opacity:.3; }
.next-btn{
  margin-left:auto; background:var(--ink); color:var(--gold); font-weight:900; font-size:12.5px;
  padding:10px 20px; border-radius:8px;
}

/* ---------- 오버레이(보상/휴식/이벤트/게임오버/승리) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,20,12,.88); z-index:100; display:flex; align-items:center;
  justify-content:center; padding:24px; backdrop-filter:blur(2px);
}
.panel{
  background:var(--parchment); border:4px solid var(--ink); border-radius:16px; padding:26px 22px;
  max-width:440px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.5);
  max-height:88vh; overflow-y:auto;
}
.panel h2{ font-size:18px; margin:0 0 6px; color:var(--ink); }
.panel .desc{ font-size:12.5px; color:#6b5a42; margin-bottom:18px; line-height:1.6;}
.reward-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:14px;}
.reward-card{
  width:120px; background:#fff9ec; border:2px solid var(--parchment-dark); border-radius:12px; padding:12px 8px;
  cursor:pointer; transition:transform .15s, box-shadow .15s;
}
.reward-card:hover{ transform:translateY(-4px); box-shadow:0 6px 14px rgba(0,0,0,.2); }
.reward-card .ric{ font-size:32px; margin-bottom:6px;}
.reward-card .rname{ font-size:11.5px; font-weight:900; margin-bottom:4px;}
.reward-card .rdesc{ font-size:9.5px; color:#7a6a52; line-height:1.4;}
.reward-card .rrarity{ font-size:8px; font-weight:900; margin-top:6px; padding:2px 6px; border-radius:10px; display:inline-block;}
.rrarity.common{ background:#d9d9d9; color:#444;}
.rrarity.rare{ background:#cfe0f5; color:#2a5788;}
.rrarity.legendary{ background:#f0d9a6; color:#8a5a0a;}
.panel-btn{
  background:var(--mustard); color:var(--ink); font-weight:900; font-size:13px; padding:11px 24px;
  border-radius:8px; border-bottom:3px solid var(--mustard-dark); margin:4px;
}
.panel-btn.secondary{ background:transparent; border:2px solid var(--path-tan-dark); color:var(--ink); border-bottom:none;}
.panel-btn.danger{ background:var(--ember); color:#fff; border-bottom-color:var(--ember-dark);}

/* ---------- 네트워킹 신청(DB 수집) 폼 ---------- */
.btn-lead{
  display:block; margin:16px auto 0; background:linear-gradient(180deg,var(--blue),#3f6f9c);
  color:#fff; font-weight:900; font-size:17px; padding:19px 44px; border-radius:14px;
  border-bottom:5px solid #2d5175; box-shadow:0 5px 0 rgba(0,0,0,.25);
  transition:transform .08s; letter-spacing:.3px;
}
.btn-lead:active{ transform:translateY(3px); border-bottom-width:1px; }
.lead-panel{ text-align:left; }
.lead-title{ text-align:center; font-size:17px; font-weight:900; color:var(--ink); margin:0 0 6px; }
.lead-lead{ text-align:center; font-size:11.5px; color:#6b5a42; line-height:1.65; margin-bottom:16px; }
.lead-field{ margin-bottom:10px; }
.lead-field label{ display:block; font-size:11.5px; font-weight:900; color:var(--ink); margin-bottom:5px; }
.lead-field .req{ color:var(--ember); margin-left:2px; }
.lead-field input{
  width:100%; padding:11px 12px; font-size:14px; font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  background:#fff9ec; border:2px solid var(--parchment-dark); border-radius:8px; outline:none;
  transition:border-color .15s, background .15s;
}
.lead-field input::placeholder{ color:#b6a684; }
.lead-field input:focus{ border-color:var(--mustard-dark); background:#fff; }
.lead-field input.err{ border-color:var(--ember); background:#fbe9e5; }
.lead-msg{ font-size:10.5px; font-weight:700; color:var(--ember); margin-top:4px; display:none; }
.lead-msg.show{ display:block; }
.hp-trap{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }

.consent-box{ border:2px solid var(--parchment-dark); border-radius:10px; background:#fff9ec; padding:11px 12px; margin:14px 0 4px; }
.consent-row{ display:flex; align-items:flex-start; gap:8px; font-size:11.5px; line-height:1.55; color:var(--ink); }
.consent-row + .consent-row{ margin-top:9px; }
.consent-row input[type="checkbox"]{ width:18px; height:18px; margin:1px 0 0; accent-color:var(--moss-dark); flex-shrink:0; cursor:pointer; }
.consent-row label{ flex:1; cursor:pointer; }
.consent-all{ font-weight:900; border-bottom:1px dashed var(--parchment-dark); padding-bottom:10px; margin-bottom:2px; }
.tag-req{ color:var(--ember); font-weight:900; }
.tag-opt{ color:#8a7758; font-weight:900; }
.detail-toggle{ display:inline-block; background:none; padding:0; margin-left:2px; font-size:10.5px; color:#8a7758; text-decoration:underline; font-family:inherit; }
.detail-body{ display:none; margin-top:7px; padding:10px 11px; background:#f2e5c6; border-radius:8px; font-size:10.5px; line-height:1.7; color:#5f5039; white-space:pre-line; max-height:180px; overflow-y:auto; }
.detail-body.show{ display:block; }
.lead-note{ font-size:10px; color:#8a7758; text-align:center; line-height:1.6; margin-top:10px; }
.lead-btns{ text-align:center; margin-top:14px; }
.panel-btn[disabled]{ opacity:.55; cursor:default; }
</style>

["Q001","recruit","채용공고에 특정 성별만 지원 가능하다고 적는 것은?",["직무 특성상 예외가 인정되는 극히 일부를 제외하면 원칙적으로 금지된다","회사 재량이라 문제없다","공고에만 명시하면 합법이다","지원자가 적으면 예외가 인정된다"],0,"남녀고용평등법상 모집·채용에서의 성차별은 원칙적으로 금지되며, 예외는 직무의 성질상 불가피한 경우로 매우 제한적으로만 인정됩니다."],

["Q003","recruit","채용 과정에서 지원자의 개인정보를 수집할 때 반드시 필요한 것은?",["수집 목적을 알리고 본인 동의를 받는 것","수집 후 사후 통보만 하면 된다","동의 없이도 채용 목적이면 자유롭게 수집 가능하다","합격자에 한해서만 동의를 받으면 된다"],0,"개인정보보호법에 따라 채용 전형에서도 개인정보 수집·이용 목적을 명확히 고지하고 동의를 받아야 합니다."],

["Q005","recruit","수습기간 중 해고(채용 취소)에 대한 설명으로 옳은 것은?",["수습이라도 정당한 이유 없이 함부로 해고할 수 없다","수습 기간에는 사유 없이 언제든 해고 가능하다","수습 근로자는 근로기준법 보호 대상이 아니다","수습 계약은 구두로만 체결해도 무방하다"],0,"수습 근로자도 근로기준법상 근로자이므로, 해고에는 정당한 이유가 필요합니다. 다만 통상 해고보다 다소 완화된 기준이 적용될 수 있습니다."],

["Q010","recruit","채용공고에 실제보다 높은 연봉이나 근무조건을 제시해 지원자를 모집하는 행위는?",["채용절차법상 허위 채용광고로 문제될 수 있다","마케팅 기법으로 법적 문제가 없다","입사 후 정정하면 무관하다","구두로만 안내하면 괜찮다"],0,"채용절차의 공정화에 관한 법률은 거짓 채용광고 게시를 금지하고 있으며, 위반 시 제재 대상이 될 수 있습니다."],
["Q011","recruit","경력직 채용 시 전 직장과의 경업금지약정을 검토해야 하는 이유는?",["약정 위반 시 신규 입사자와 회사 모두 법적 분쟁에 휘말릴 수 있다","경업금지약정은 법적 효력이 전혀 없다","이직자는 어떤 약정도 신경 쓸 필요가 없다","경업금지약정은 임원에게만 적용된다"],0,"유효한 경업금지약정을 위반해 이직하면 전 직장이 손해배상 등을 청구할 수 있어, 채용 전 사전 확인이 필요합니다."],
["Q012","recruit","채용 전형에서 지원자에게 가족관계, 결혼 여부 등을 묻는 것은?",["직무와 무관한 개인정보 요구로 지양해야 한다","지원자를 이해하는 데 필요하므로 항상 물어봐야 한다","법적으로 아무 제한이 없다","면접관 재량으로 자유롭게 물어도 된다"],0,"채용절차법과 관련 지침은 직무 수행과 무관한 개인정보(용모, 키, 가족관계, 재산 등) 요구를 제한하고 있습니다."],
["Q013","recruit","인턴십 이후 정규직 전환 채용의 일반적인 절차는?",["인턴 기간의 근무 평가를 바탕으로 별도 전환 심사를 거친다","인턴은 자동으로 모두 정규직 전환된다","전환 여부는 인턴 본인이 결정한다","전환 심사는 법적으로 금지되어 있다"],0,"체험형·채용연계형 인턴 모두 통상 근무 태도와 성과에 대한 평가를 바탕으로 전환 심사를 진행합니다."],
["Q014","recruit","헤드헌팅(서치펌)을 통한 채용의 특징은?",["주로 경력직·전문직군 등 필요 인재를 직접 발굴해 추천받는 방식이다","신입 공채 전용 채용 방식이다","채용 비용이 전혀 들지 않는다","서치펌은 채용 후보자와 계약을 대신 체결해준다"],0,"헤드헌팅은 서치펌이 기업의 요청에 따라 적합한 인재를 발굴·추천하는 방식으로, 주로 경력직이나 전문 인력 채용에 활용됩니다."],
["Q015","recruit","최종 합격자에게 근로계약서를 작성해야 하는 시점은?",["근로 개시 전에 작성해 교부하는 것이 원칙이다","입사 후 3개월 이내면 언제든 무방하다","연봉 협상이 끝나면 작성하지 않아도 된다","구두 합의만으로 충분하다"],0,"근로기준법상 사용자는 근로계약 체결 시 임금, 근로시간 등 주요 근로조건을 명시한 서면을 근로자에게 교부해야 합니다."],
["Q016","recruit","장애인 의무고용제도에 대한 설명으로 옳은 것은?",["일정 규모 이상 사업주는 상시근로자의 일정 비율 이상을 장애인으로 고용해야 한다","모든 사업장에 동일하게 강제 적용되는 것은 아니다","의무를 지키지 않아도 아무 불이익이 없다","장애인 고용은 공공기관에만 해당한다"],0,"장애인고용촉진법에 따라 일정 규모 이상 민간·공공 사업주는 법정 의무고용률 이상 장애인을 고용해야 하며, 미이행 시 부담금이 부과됩니다."],
["Q017","recruit","채용 시 인적성검사를 활용하는 주된 목적은?",["직무 적합도와 조직 적응 가능성을 객관적으로 가늠하는 참고 자료로 활용한다","검사 점수만으로 최종 합격을 100% 결정한다","불합격자를 걸러내기 위한 형식적 절차일 뿐이다","법적으로 반드시 실시해야 하는 의무 절차이다"],0,"인적성검사는 직무 역량과 조직 적합성을 파악하기 위한 보조 도구로 활용되며, 단독으로 당락을 결정하는 절대 기준으로 쓰이지는 않는 것이 일반적입니다."],
["Q018","recruit","채용 담당자가 지원자의 SNS를 임의로 조사해 평가에 반영하는 것은?",["사생활 침해 소지가 있어 신중해야 한다","채용 담당자의 당연한 권한이다","법적으로 전혀 문제되지 않는다","모든 회사가 의무적으로 해야 하는 절차다"],0,"직무와 무관한 사생활 정보를 임의로 수집·활용하는 것은 개인정보보호 및 사생활 침해 논란의 소지가 있어 신중한 접근이 필요합니다."],
["Q019","recruit","채용형 인턴 계약서에 반드시 포함되어야 할 내용은?",["근로시간, 임금 등 근로기준법상 필수 근로조건","전환 시 예상 연봉 협상 시나리오","입사 후 5년 커리어 로드맵","팀 회식 참석 의무 조항"],0,"인턴도 근로자이므로 근로계약서에는 근로시간, 임금, 휴일 등 근로기준법이 정한 필수 근로조건이 반드시 명시되어야 합니다."],
["Q020","recruit","다수 지원자를 효율적으로 스크리닝하기 위한 ATS(지원자 추적 시스템)의 역할은?",["지원서 접수부터 전형 단계별 진행 상황을 체계적으로 관리한다","최종 합격자를 자동으로 확정한다","면접관의 평가를 대신 작성해준다","연봉 협상을 자동으로 진행한다"],0,"ATS는 채용 프로세스 전반(접수, 서류검토, 일정관리 등)을 효율적으로 관리하도록 돕는 시스템으로, 최종 판단은 채용 담당자가 합니다."],
["Q021","ld","신입사원 온보딩 프로그램의 핵심 목적은?",["조직 적응과 직무 이해를 도와 조기 전력화를 돕는다","입사 첫날 서류 작성만 마치면 끝이다","온보딩은 법적 의무 사항일 뿐이다","경력직에게는 필요 없는 절차다"],0,"온보딩은 신규 입사자가 조직문화와 업무를 빠르게 이해하고 적응하도록 돕는 과정으로, 조기 이탈 방지에도 중요합니다."],
["Q022","ld","법정 의무교육으로 대부분의 사업장에서 매년 실시해야 하는 것이 아닌 것은?",["신규 입사자 채용 면접 스킬 교육","성희롱 예방교육","개인정보보호 교육","산업안전보건교육"],0,"성희롱 예방교육, 개인정보보호 교육, 산업안전보건교육 등은 관련 법령에 따른 법정 의무교육이지만, 면접 스킬 교육은 법정 의무가 아닙니다."],
["Q023","ld","OJT(On-the-Job Training)의 특징은?",["실제 업무 현장에서 선배·상사의 지도를 받으며 배우는 방식이다","반드시 외부 강사를 초빙해야 한다","오프라인 집합 교육만을 의미한다","신입사원에게는 적용할 수 없다"],0,"OJT는 직무 현장에서 실제 업무를 수행하며 습득하는 교육 방식으로, 실무 적용력을 높이는 데 효과적입니다."],
["Q024","ld","사내 멘토링 제도를 운영하는 주요 목적은?",["경험 많은 구성원이 신규·주니어 구성원의 적응과 성장을 돕는다","멘토가 멘티의 업무를 대신 처리해준다","승진 심사를 멘토가 결정한다","연봉 협상을 멘토가 대행한다"],0,"멘토링은 조직 내 지식과 경험을 전수하고 정서적 지지를 제공해 구성원의 적응과 성장을 촉진하는 제도입니다."],
["Q025","ld","고용보험 환급과정(국비지원 훈련)을 활용하는 이유는?",["교육훈련 비용의 일부를 정부로부터 지원받을 수 있다","모든 교육이 100% 무료가 된다","정부 승인 없이도 자유롭게 신청 가능하다","대기업만 신청할 수 있다"],0,"고용보험 환급과정은 사업주가 직업능력개발훈련을 실시할 경우 일정 요건을 충족하면 훈련비 일부를 지원받는 제도입니다."],
["Q026","ld","승계계획(Succession Planning)의 의미는?",["핵심 직책의 공백에 대비해 후보자를 미리 육성·관리하는 것","퇴사자의 인수인계 문서를 작성하는 것","조직도를 매년 갱신하는 것","신입사원 채용 계획을 세우는 것"],0,"승계계획은 핵심 포지션이 공석이 될 경우를 대비해 내부 후보자를 사전에 파악하고 육성하는 인재관리 활동입니다."],
["Q027","ld","교육의 효과성을 확인하기 위한 방법으로 가장 적절한 것은?",["교육 만족도뿐 아니라 실제 현업 적용도와 성과 변화를 함께 살펴본다","교육 종료 후 설문만 확인하면 충분하다","교육 참석률만 확인하면 된다","교육비 집행 내역만 점검하면 된다"],0,"교육 효과는 만족도 조사에 그치지 않고, 학습 내용이 실제 업무에 적용되는지와 성과에 미치는 영향까지 살펴보는 것이 바람직합니다."],
["Q028","ld","사내 강사(SME, 현업 전문가)를 활용한 교육의 장점은?",["실무에 즉시 적용 가능한 현장 지식을 전달할 수 있다","외부 강사보다 항상 강의력이 뛰어나다","교육 준비 시간이 전혀 들지 않는다","법정 의무교육을 대체할 수 있다"],0,"현업 전문가가 강사로 참여하면 실제 업무 맥락에 맞는 살아있는 지식을 전달할 수 있다는 장점이 있습니다."],
["Q029","ld","이러닝(e-Learning) 교육의 특징으로 옳은 것은?",["시간과 장소 제약 없이 자율적으로 학습할 수 있다","반드시 정해진 시간에 한 장소에 모여야 한다","실습이 필요한 교육에는 전혀 활용할 수 없다","현장 교육보다 항상 학습 효과가 낮다"],0,"이러닝은 학습자가 원하는 시간과 장소에서 유연하게 학습할 수 있다는 것이 큰 장점이며, 최근에는 다양한 실습형 콘텐츠도 활용됩니다."],
["Q030","ld","직무교육 계획을 수립할 때 가장 먼저 해야 할 일은?",["구성원의 현재 역량과 요구되는 역량 간의 격차를 파악한다","일단 인기 있는 외부 교육을 신청한다","예산부터 확정한다","교육 일정표를 먼저 정한다"],0,"효과적인 교육설계는 현재 역량 수준과 목표 역량 사이의 갭(Gap)을 분석하는 것에서 출발합니다."],
["Q031","ld","리더십 파이프라인 관점에서 신임 팀장에게 가장 필요한 교육은?",["실무자에서 관리자로의 역할 전환에 필요한 코칭·피드백 스킬","전사 재무제표 작성법","신입사원 채용 면접관 자격증","전산 시스템 개발 언어"],0,"실무자에서 관리자로 전환할 때는 일하는 방식 자체가 바뀌므로, 위임·코칭·피드백 등 관리자 역할에 맞는 교육이 중요합니다."],
["Q032","ld","장애인 인식개선 교육에 대한 설명으로 옳은 것은?",["일정 규모 이상 사업장은 매년 1회 이상 실시해야 하는 법정 의무교육이다","희망하는 사업장만 자율적으로 실시하면 된다","임원만 이수하면 되는 교육이다","한번 이수하면 평생 재이수가 필요 없다"],0,"장애인고용촉진 및 직업재활법에 따라 사업주는 매년 1회 이상 장애인 인식개선 교육을 실시해야 합니다."],
["Q033","ld","경력개발제도(CDP)의 목적은?",["구성원 개인의 성장 경로를 조직 목표와 연계해 체계적으로 지원한다","모든 직원을 임원으로 승진시키는 것이다","퇴사를 유도하는 제도이다","연봉 인상만을 목적으로 한다"],0,"경력개발제도는 구성원의 장기적 성장 경로를 조직의 인재 육성 전략과 연계해 지원하는 체계입니다."],
["Q034","ld","교육훈련 예산을 편성할 때 고려할 요소가 아닌 것은?",["전 직원의 개인 SNS 팔로워 수","전략적으로 필요한 핵심 역량","법정 의무교육 이수 현황","조직의 성장 단계와 사업 방향"],0,"교육 예산은 조직의 사업 전략, 필요 역량, 법정 의무 이행 여부 등을 기준으로 편성하며, 개인 SNS 팔로워 수는 무관한 요소입니다."],
["Q035","ld","블렌디드 러닝(Blended Learning)이란?",["오프라인 교육과 온라인 학습을 결합한 방식이다","오직 온라인 강의만을 의미한다","외부 위탁 교육만을 뜻한다","1:1 개인 코칭만을 지칭한다"],0,"블렌디드 러닝은 집합교육, 이러닝, 실습 등 여러 학습 방식을 혼합해 학습 효과를 높이는 방식입니다."],

["Q037","ld","직무순환(Job Rotation)의 효과로 보기 어려운 것은?",["특정 부서의 매출을 즉시 2배로 늘린다","다양한 직무 경험을 통해 시야를 넓힌다","조직 전체에 대한 이해도를 높인다","여러 부서 간 협업 네트워크가 형성된다"],0,"직무순환은 다양한 경험과 시야 확대, 네트워크 형성에 효과적이지만 매출을 직접적으로 증대시키는 수단은 아닙니다."],

["Q065","comp","임금명세서 교부에 대한 설명으로 옳은 것은?",["사용자는 임금 지급 시 임금 구성항목별 금액 등을 적은 임금명세서를 교부해야 한다","임금명세서 교부는 회사가 원할 때만 하면 된다","서면 명세서만 인정되고 전자문서는 불가하다","임금명세서에는 지급총액만 적으면 충분하다"],0,"근로기준법에 따라 사용자는 임금 지급 시 임금 항목별 계산방법 등을 명시한 임금명세서를 근로자에게 교부해야 합니다."],

["Q067","comp","임금체불이 발생했을 때 근로자가 취할 수 있는 조치는?",["고용노동부에 진정을 제기하거나 민사상 청구를 할 수 있다","회사를 그만두는 것 외에는 방법이 없다","3년이 지나도 아무 때나 청구 가능하다","임금체불은 형사처벌 대상이 될 수 없다"],0,"임금체불 시 근로자는 고용노동부에 진정을 제기하거나 민사소송으로 미지급 임금을 청구할 수 있으며, 사용자는 형사처벌 대상이 될 수도 있습니다."],
["Q068","comp","평균임금이 사용되는 대표적인 경우는?",["퇴직금, 휴업수당 등 산정 기준으로 활용된다","기본급 인상률 결정에만 사용된다","성과급 지급 여부 결정에만 쓰인다","4대보험료 산정과는 무관하다"],0,"평균임금은 퇴직금, 휴업수당, 산재보상금 등 다양한 법정 급여의 산정 기준으로 활용됩니다."],
["Q069","comp","성과급(인센티브)과 기본급의 일반적인 차이는?",["성과급은 실적에 따라 변동하고, 기본급은 통상 고정적으로 지급된다","성과급과 기본급은 완전히 동일한 개념이다","기본급은 실적에 따라서만 지급된다","성과급은 반드시 매월 고정액으로 지급된다"],0,"기본급은 통상 정해진 금액이 정기적으로 고정 지급되는 반면, 성과급은 실적이나 성과 평가 결과에 따라 변동되는 것이 일반적입니다."],
["Q070","comp","연차수당(미사용 연차에 대한 보상)이 발생하는 경우는?",["연차유급휴가를 사용하지 못하고 그 사용 기한이 지났을 때 발생할 수 있다","연차를 하루라도 사용하면 전액 소멸된다","연차수당은 회사가 원할 때만 지급하면 된다","입사 첫 달부터 무조건 발생한다"],0,"연차유급휴가를 사용기한 내 사용하지 못한 경우, 사용자가 적법한 사용촉진 조치를 하지 않았다면 미사용 연차에 대해 수당을 지급해야 합니다."],
["Q071","comp","복리후생 제도를 설계할 때 고려할 요소로 가장 적절한 것은?",["구성원의 니즈와 조직의 재정 여건을 함께 고려한다","가장 비용이 저렴한 항목만 선택한다","경쟁사와 무관하게 독자적으로만 설계한다","법정 복리후생 외에는 전혀 고려하지 않는다"],0,"효과적인 복리후생 설계를 위해서는 구성원의 실제 니즈와 조직의 재정 여건, 시장 경쟁력을 종합적으로 고려해야 합니다."],
["Q072","comp","임금피크제에 대한 설명으로 옳은 것은?",["일정 연령 이후 임금을 조정하는 대신 고용을 연장하는 제도이다","모든 직원의 임금을 매년 무조건 인상하는 제도이다","신입사원에게만 적용되는 제도이다","임금피크제는 법으로 전면 금지되어 있다"],0,"임금피크제는 정년 연장이나 고용 안정을 조건으로, 일정 시점 이후 임금을 조정하는 제도로 다수 기업에서 도입하고 있습니다."],

["Q074","comp","비정규직 근로자에 대한 차별적 처우 금지 원칙은?",["합리적 이유 없이 정규직과 차별해서는 안 된다는 원칙이다","비정규직에게는 어떤 법적 보호도 적용되지 않는다는 뜻이다","비정규직은 임금을 아예 지급하지 않아도 된다는 뜻이다","정규직보다 항상 낮은 임금을 줘야 한다는 원칙이다"],0,"기간제 및 단시간근로자 보호법 등에 따라 합리적 이유 없이 비정규직을 정규직과 차별하는 것은 금지됩니다."],
["Q075","comp","야간근로수당이 적용되는 일반적인 시간대는?",["오후 10시부터 다음날 오전 6시 사이의 근로","오전 6시부터 오후 6시 사이의 근로","점심시간 전후 1시간","주말 근로 전체"],0,"근로기준법상 야간근로는 오후 10시부터 다음날 오전 6시 사이의 근로를 의미하며, 이 시간대 근로에는 가산수당이 적용됩니다."],

["Q077","comp","단시간근로자(파트타임)의 임금 산정 원칙은?",["근로시간에 비례해 통상 근로자와 균등하게 처우한다","단시간근로자는 최저임금 적용 대상이 아니다","무조건 통상 근로자와 동일한 급여를 줘야 한다","단시간근로자에게는 주휴수당이 발생하지 않는다"],0,"단시간근로자는 근로시간에 비례해 임금이 산정되며, 일정 요건 충족 시 주휴수당 등도 통상 근로자와 균등하게 적용됩니다."],
["Q078","comp","임금대장(임금관리대장)을 작성·보존해야 하는 이유는?",["법정 의무이며 임금 관련 분쟁 발생 시 중요한 근거자료가 된다","단순 사내 참고용이라 보존 의무가 없다","세무 목적 외에는 활용되지 않는다","분기별로 한 번만 작성하면 충분하다"],0,"근로기준법상 사용자는 임금대장을 작성해 일정 기간 보존해야 하며, 이는 임금 관련 분쟁 시 핵심 증빙자료로 활용됩니다."],
["Q079","culture","eNPS(직원 순추천지수)가 측정하는 것은?",["구성원이 회사를 지인에게 추천할 의향이 얼마나 되는지","회사의 재무 건전성","고객 만족도","채용 브랜드 인지도"],0,"eNPS는 '이 회사를 주변에 추천하겠는가'라는 질문을 통해 구성원의 조직 몰입과 만족도를 가늠하는 대표적 지표입니다."],
["Q080","culture","직장 내 괴롭힘 금지법의 적용 대상은?",["직장에서의 지위나 관계 우위를 이용한 괴롭힘 행위 전반","사업장 밖에서 발생한 모든 사적 다툼","오직 임원 간의 갈등만 해당","5인 미만 사업장은 전혀 적용되지 않음(신고·조치 의무 등 일부는 적용)"],0,"직장 내 괴롭힘 금지법은 직장에서의 지위·관계 우위를 이용해 신체적·정신적 고통을 주는 행위를 규율하며, 사용자는 조사·조치 의무를 집니다."],
["Q081","culture","고충처리제도를 운영하는 목적은?",["구성원의 애로사항을 공식 채널로 접수·해결해 조직 신뢰를 높인다","불만이 있는 구성원을 걸러내기 위함이다","법적 의무이므로 형식적으로만 운영한다","경영진의 의사결정을 감시하기 위함이다"],0,"고충처리제도는 구성원이 겪는 다양한 애로사항을 공식적으로 접수하고 해결함으로써 조직에 대한 신뢰를 높이는 역할을 합니다."],
["Q082","culture","재택근무·하이브리드 근무제 도입 시 고려해야 할 사항은?",["업무 성과 관리 방식과 소통 체계를 함께 정비해야 한다","무조건 사무실 근무보다 생산성이 낮다고 가정해야 한다","법적으로 전면 금지된 근무 형태다","도입만 하면 별도 관리가 필요 없다"],0,"재택·하이브리드 근무는 대면 근무와 다른 성과관리·소통 방식이 필요하므로, 관련 체계를 함께 정비하는 것이 중요합니다."],
["Q083","culture","조직 내 심리적 안전감(Psychological Safety)이 높은 팀의 특징은?",["실수나 다른 의견을 자유롭게 이야기해도 불이익이 없다고 느낀다","실수하면 즉시 불이익을 받는다고 느낀다","의견 차이를 표현하는 것이 금기시된다","상급자의 의견에 무조건 따라야 한다"],0,"심리적 안전감이 높은 팀은 구성원이 실수나 반대 의견을 말해도 처벌받지 않는다고 느끼며, 이는 학습과 혁신에 긍정적 영향을 줍니다."],
["Q084","culture","MZ세대 구성원의 조직 내 특징으로 자주 언급되는 것은?",["공정한 보상과 성장, 워라밸을 중요하게 여기는 경향이 있다","오직 연공서열만을 최우선 가치로 여긴다","조직에 대한 어떠한 의견도 제시하지 않는다","이직을 절대 고려하지 않는다"],0,"다만 세대 특성은 개인차가 크므로 일반화에는 유의해야 하지만, 공정성·성장·워라밸에 대한 관심이 자주 언급되는 특징입니다."],
["Q085","culture","사내 커뮤니케이션 채널을 다양화하는 이유는?",["구성원 특성과 상황에 맞는 효과적인 정보 전달과 피드백을 촉진하기 위함이다","채널이 많을수록 무조건 혼란만 가중되기 때문이다","경영진의 업무를 줄이기 위함이다","법적으로 다양화가 의무화되어 있기 때문이다"],0,"공지사항, 익명 채널, 타운홀 등 다양한 채널을 운영하면 상황과 구성원 특성에 맞는 효과적인 소통이 가능해집니다."],
["Q086","culture","조직문화 진단(서베이) 결과를 활용하는 바람직한 방식은?",["결과를 구성원과 투명하게 공유하고 개선 액션으로 연결한다","결과를 경영진만 확인하고 비공개로 종료한다","부정적 결과는 삭제하고 긍정적 결과만 공유한다","진단 이후 아무 조치도 취하지 않는다"],0,"조직문화 진단은 결과를 투명하게 공유하고 구체적인 개선 활동으로 이어질 때 구성원의 신뢰와 참여를 이끌어낼 수 있습니다."],
["Q087","culture","직장 내 성희롱 예방교육에 대한 설명으로 옳은 것은?",["사업장 규모와 무관하게 매년 1회 이상 실시해야 하는 법정 의무교육이다","임원만 이수하면 되는 교육이다","한 번 이수하면 이후 재교육이 필요 없다","희망하는 직원만 선택적으로 들으면 된다"],0,"남녀고용평등법에 따라 사업주는 원칙적으로 사업장 규모와 무관하게 매년 1회 이상 성희롱 예방교육을 실시해야 합니다."],
["Q088","culture","조직개편 시 커뮤니케이션의 바람직한 방향은?",["변화의 배경과 방향을 시의적절하게 투명히 공유한다","조직개편 완료 전까지 철저히 함구한다","루머가 돌더라도 대응하지 않는다","일부 구성원에게만 비공식적으로 알린다"],0,"조직개편처럼 민감한 변화일수록 배경과 방향을 시의적절하고 투명하게 공유해야 불필요한 불안과 루머를 줄일 수 있습니다."],
["Q089","culture","수평적 조직문화를 표방하며 도입하는 호칭제도(님/프로 등)의 목적은?",["직급에 따른 위계보다 자유로운 의사소통 분위기를 조성하려는 것이다","조직의 위계질서를 강화하려는 것이다","급여 체계를 단순화하려는 것이다","법적으로 의무화된 제도이기 때문이다"],0,"호칭 파괴는 직급 위계를 낮추고 수평적이고 자유로운 소통 문화를 조성하려는 시도로, 다만 제도만으로는 문화가 바뀌지 않는다는 한계도 있습니다."],
["Q090","culture","조직 내 세대 간 갈등을 줄이기 위한 접근으로 적절한 것은?",["서로 다른 가치관을 이해하는 상호 교육과 소통 기회를 마련한다","특정 세대의 의견만 전적으로 수용한다","세대 간 접점을 아예 차단한다","갈등이 없다고 가정하고 방치한다"],0,"세대 간 가치관 차이를 서로 이해할 수 있는 소통과 교육 기회를 마련하는 것이 갈등 완화에 효과적입니다."],
["Q091","culture","워라밸(일과 삶의 균형) 제도의 예로 보기 어려운 것은?",["무제한 초과근무 의무화 제도","시차출퇴근제","연차 사용 촉진 캠페인","유연근무제"],0,"시차출퇴근제, 유연근무제, 연차 사용 촉진 등은 워라밸을 지원하는 제도이며, 초과근무를 의무화하는 것은 반대되는 방향입니다."],
["Q092","culture","조직 내 다양성과 포용성(D&I)을 높이는 활동의 예는?",["채용·승진에서 다양한 배경의 구성원에게 공정한 기회를 보장한다","특정 집단만을 우대해 다른 집단을 배제한다","다양성 관련 논의 자체를 금지한다","동일한 배경의 인재만 지속적으로 채용한다"],0,"D&I 활동은 성별, 연령, 배경 등이 다른 구성원들에게 공정한 기회를 보장하고 다양한 관점이 존중받는 문화를 만드는 것을 목표로 합니다."],
["Q093","culture","조직 내 익명 신고·제보 채널을 운영하는 이유는?",["보복에 대한 두려움 없이 문제를 제기할 수 있는 통로를 제공하기 위함이다","신고 내용을 무시하기 위한 형식적 채널이기 때문이다","신고자를 특정해 불이익을 주기 위함이다","경영진 감시를 피하기 위함이다"],0,"익명 채널은 보복에 대한 우려로 문제 제기를 주저하는 구성원이 안전하게 목소리를 낼 수 있도록 돕는 장치입니다."],
["Q094","culture","타운홀 미팅의 목적으로 가장 적절한 것은?",["경영진과 구성원이 직접 소통하며 정보를 공유하고 질의응답을 나눈다","특정 부서의 인사평가를 진행하는 자리다","외부 고객 대상 설명회를 뜻한다","징계 대상자를 공개 심의하는 자리다"],0,"타운홀 미팅은 경영진이 전사 구성원과 직접 소통하며 회사의 방향과 이슈를 공유하고 질문을 받는 대표적 소통 방식입니다."],
["Q095","culture","조직문화와 핵심가치(Core Value)의 관계는?",["핵심가치는 구성원의 행동과 의사결정 기준이 되어 조직문화 형성에 영향을 준다","핵심가치는 액자 속 문구일 뿐 실무와는 무관하다","조직문화는 핵심가치와 전혀 관계가 없다","핵심가치는 매년 완전히 바뀌어야 한다"],0,"핵심가치가 실제 행동과 의사결정 기준으로 작동할 때 조직문화 형성에 실질적인 영향을 미칩니다."],
["Q096","culture","퇴사자 인터뷰(Exit Interview)를 실시하는 목적은?",["퇴사 사유를 파악해 조직 운영 개선의 단서를 얻는다","퇴사자를 설득해 무조건 잔류시키기 위함이다","퇴사자에게 불이익을 주기 위함이다","형식적 절차이므로 결과를 활용하지 않는다"],0,"퇴사자 인터뷰는 솔직한 퇴사 사유를 파악해 조직문화나 제도 개선에 참고하기 위한 중요한 자료로 활용됩니다."],
["Q097","culture","사내 소통에서 상향식(bottom-up) 피드백 채널이 중요한 이유는?",["현장의 목소리를 경영 의사결정에 반영할 수 있다","경영진의 권위를 낮추기 위함이다","하향식 지시만으로 충분하기 때문에 불필요하다","법적으로 반드시 운영해야 하는 채널이라서다"],0,"상향식 피드백 채널은 현장의 실질적인 의견과 문제의식을 경영 의사결정에 반영할 수 있게 해주는 중요한 통로입니다."],
["Q098","labor","근로계약서에 반드시 명시해야 하는 사항이 아닌 것은?",["직원의 개인 SNS 계정","임금의 구성항목과 계산방법","소정근로시간","휴일"],0,"근로기준법상 임금, 소정근로시간, 휴일, 연차유급휴가 등은 근로계약서에 명시해야 하는 필수 사항이며, 개인 SNS 계정은 해당하지 않습니다."],
["Q099","labor","사용자가 근로자를 해고하려면 원칙적으로 언제까지 예고해야 하는가?",["적어도 30일 전에 예고해야 한다","3일 전까지만 알려도 된다","예고 없이 즉시 해고해도 무방하다","1년 전에 예고해야 한다"],0,"근로기준법상 사용자는 근로자를 해고하려면 원칙적으로 적어도 30일 전에 예고하거나, 30일분 이상의 통상임금을 지급해야 합니다."],
["Q100","labor","부당해고를 당했다고 판단한 근로자가 취할 수 있는 조치는?",["노동위원회에 부당해고 구제신청을 할 수 있다","아무 구제 수단이 없어 그냥 감수해야 한다","반드시 형사고소만 가능하다","사내 게시판에 글을 올리는 것 외에는 방법이 없다"],0,"근로자는 부당해고라고 판단되면 노동위원회에 구제신청을 하거나 법원에 소송을 제기하는 등의 방법으로 구제받을 수 있습니다."],
["Q101","labor","연차유급휴가 발생의 기본 원칙은?",["1년간 80% 이상 출근한 근로자에게 15일의 연차가 발생한다(가산 규정 별도)","입사 1개월 차부터 무조건 15일이 발생한다","연차는 회사가 임의로 지급 여부를 결정할 수 있다","1년 미만 근로자는 연차가 전혀 발생하지 않는다"],0,"근로기준법상 1년간 80% 이상 출근한 근로자에게는 15일의 연차유급휴가가 발생하며, 1년 미만 근로자도 개근한 달마다 1일씩 발생합니다."],
["Q102","labor","육아휴직에 대한 설명으로 옳은 것은?",["만 8세 이하 또는 초등학교 2학년 이하 자녀를 둔 근로자가 신청할 수 있다","오직 여성 근로자만 신청할 수 있다","육아휴직은 무급이며 어떤 지원도 없다","사업주는 육아휴직 신청을 자유롭게 거부할 수 있다"],0,"남녀고용평등법상 일정 요건을 갖춘 근로자는 성별과 무관하게 육아휴직을 신청할 수 있으며, 사업주는 정당한 사유 없이 거부할 수 없습니다."],
["Q103","labor","취업규칙 신고 의무가 발생하는 기준은?",["상시근로자 10인 이상 사업장은 취업규칙을 작성해 고용노동부에 신고해야 한다","모든 사업장은 무조건 신고해야 한다","5인 이상이면 신고 의무가 발생한다","취업규칙 신고는 법적 의무가 아니다"],0,"근로기준법상 상시 10인 이상 근로자를 사용하는 사용자는 취업규칙을 작성해 고용노동부장관에게 신고해야 합니다."],
["Q104","labor","법정근로시간의 원칙은?",["1주 40시간, 1일 8시간을 초과할 수 없다(연장근로 별도 요건 하에 가능)","1주 52시간을 기본 근로시간으로 한다","근로시간에 대한 법적 제한은 없다","1일 근로시간 제한만 있고 주간 제한은 없다"],0,"근로기준법상 법정근로시간은 1주 40시간, 1일 8시간이며, 당사자 합의에 따라 제한된 범위 내에서 연장근로가 가능합니다."],
["Q105","labor","휴게시간에 대한 설명으로 옳은 것은?",["근로시간이 8시간인 경우 1시간 이상의 휴게시간을 근로시간 도중에 부여해야 한다","휴게시간은 근로시간에 포함해 급여를 지급해야 한다","휴게시간은 반드시 근무 시작 전에 부여해야 한다","4시간 미만 근무자도 반드시 1시간을 부여해야 한다"],0,"근로기준법상 근로시간이 4시간이면 30분, 8시간이면 1시간 이상의 휴게시간을 근로 도중에 부여해야 하며, 이는 무급이 원칙입니다."],
["Q106","labor","산업재해가 발생했을 때 사업주의 우선 조치는?",["즉시 필요한 구호조치를 하고 관련 절차에 따라 신고한다","산재 사실을 숨기고 개인적으로 합의한다","일정 기간이 지난 후 신고해도 무방하다","근로자 본인이 알아서 처리하도록 둔다"],0,"산업재해 발생 시 사업주는 즉시 구호조치를 취하고, 산업안전보건법 등 관련 규정에 따라 신고 및 후속 조치를 이행해야 합니다."],
["Q107","labor","단시간근로자(파트타임)에게도 적용되는 근로기준법상 원칙은?",["근로시간에 비례한 균등처우 원칙이 적용된다","근로기준법이 전혀 적용되지 않는다","최저임금 적용 대상에서 제외된다","연차유급휴가가 발생하지 않는다"],0,"단시간근로자도 근로기준법의 보호를 받으며, 근로시간에 비례해 임금·연차 등에서 통상 근로자와 균등한 처우를 받는 것이 원칙입니다."],
["Q108","labor","임신 중인 여성 근로자의 근로시간 관련 보호 규정은?",["시간외근로(연장근로)가 원칙적으로 제한된다","임신과 관계없이 동일한 연장근로가 적용된다","보호 규정 위반 시 아무 제재가 없다","출산 예정일까지는 어떠한 보호도 적용되지 않는다"],0,"근로기준법상 임신 중인 여성에 대해서는 연장근로 제한 등 모성보호를 위한 다양한 규정이 적용됩니다."],
["Q109","labor","근로자 대표(근로자대표제도)의 역할로 옳은 것은?",["탄력적 근로시간제 등 노사 합의가 필요한 사항에 대해 근로자를 대표해 협의한다","사용자의 인사권을 대신 행사한다","임금 인상률을 단독으로 결정한다","취업규칙을 단독으로 제개정한다"],0,"근로자대표는 탄력적 근로시간제, 연차휴가 대체 등 법에서 정한 노사 합의 사항에 대해 근로자를 대표해 협의·동의하는 역할을 합니다."],
["Q110","labor","해고 절차에서 서면 통지가 요구되는 이유는?",["해고 사유와 시기를 서면으로 통지해야 해고의 효력이 인정된다","구두 통지가 원칙이고 서면은 참고용일 뿐이다","서면 통지는 대기업에만 적용되는 규정이다","서면 통지는 근로자가 요청할 때만 하면 된다"],0,"근로기준법상 사용자가 근로자를 해고하려면 해고 사유와 시기를 서면으로 통지해야 하며, 이를 지키지 않으면 해고의 효력이 인정되지 않습니다."],
["Q111","labor","근로시간 단축(육아기 근로시간 단축 등) 제도에 대한 설명은?",["일정 요건을 갖춘 근로자가 신청할 수 있는 법정 제도이다","모든 근로자가 아무 사유 없이 신청할 수 있다","사업주는 아무 사유 없이도 항상 거부할 수 있다","단축 근로시간에는 급여를 전혀 지급하지 않는다"],0,"육아기 근로시간 단축은 남녀고용평등법상 요건을 갖춘 근로자가 신청할 수 있는 제도로, 사업주는 정당한 사유 없이 거부할 수 없습니다."],
["Q112","labor","취업규칙을 근로자에게 불리하게 변경할 때 필요한 절차는?",["원칙적으로 근로자 과반수의 동의를 받아야 한다","사용자 단독으로 자유롭게 변경할 수 있다","변경 후 사후 통보만 하면 충분하다","취업규칙은 한번 정하면 변경할 수 없다"],0,"근로기준법상 취업규칙을 근로자에게 불리하게 변경하는 경우 원칙적으로 근로자 과반수(또는 노동조합)의 동의가 필요합니다."],
["Q113","labor","포괄임금제 하에서도 실제 연장근로시간이 약정 시간을 초과하면?",["초과분에 대한 추가 수당을 지급해야 할 의무가 발생할 수 있다","포괄임금제이므로 추가 지급 의무가 전혀 없다","초과 여부와 무관하게 정액만 지급하면 된다","초과근로 자체가 법적으로 불가능하다"],0,"포괄임금제라도 실제 제공된 연장근로가 약정된 시간을 초과하면, 그 초과분에 대해서는 추가 수당 지급 의무가 발생할 수 있습니다."],
["Q114","labor","근로기준법상 사용자가 근로자명부를 작성·보존해야 하는 이유는?",["근로관계 관리와 각종 신고·증빙의 기초자료가 되기 때문이다","단순 사내 참고용이라 보존 의무가 없다","근로자명부는 채용 시에만 필요하고 이후 폐기해도 된다","세무 목적으로만 사용되는 서류다"],0,"근로기준법은 사용자에게 근로자명부를 작성하고 일정 기간 보존하도록 의무화하고 있으며, 이는 각종 신고와 분쟁 대응의 기초자료가 됩니다."],
["Q115","labor","근로자가 업무상 재해로 요양이 필요할 때 받을 수 있는 보상 체계는?",["산업재해보상보험을 통해 요양급여, 휴업급여 등을 받을 수 있다","전적으로 회사가 사비로 치료비를 지급해야 한다","보상 체계가 없어 개인이 모두 부담해야 한다","국민건강보험으로만 모든 것을 해결해야 한다"],0,"업무상 재해는 산업재해보상보험법에 따라 요양급여, 휴업급여, 장해급여 등 다양한 보상을 받을 수 있는 체계가 마련되어 있습니다."],
["Q116","labor","근로기준법상 근로자로 인정되는 핵심 판단 기준은?",["사용종속관계 하에서 임금을 목적으로 근로를 제공하는지 여부","계약서의 명칭이 '근로계약서'인지 여부","4대보험 가입 여부만으로 결정된다","근무 장소가 사업장 내부인지 여부만으로 결정된다"],0,"근로자성 판단은 계약의 형식적 명칭보다 실질적으로 사용종속관계 하에서 임금을 목적으로 근로를 제공했는지를 종합적으로 살펴 판단합니다."],
["Q117","org","기능식 조직구조(Functional Structure)의 특징은?",["인사, 재무, 영업 등 전문 기능별로 부서를 구성한다","제품별로 독립된 사업부를 구성한다","프로젝트 단위로만 조직을 구성한다","고객 유형별로만 조직을 나눈다"],0,"기능식 조직은 인사·재무·영업 등 전문 기능을 기준으로 부서를 나누어, 각 분야의 전문성을 살리는 데 유리한 구조입니다."],
["Q118","org","매트릭스 조직(Matrix Structure)의 특징은?",["기능조직과 프로젝트(제품)조직이 결합되어 이중 보고체계를 가진다","보고체계가 단 하나로만 단순화된다","오직 임시 조직에만 적용되는 구조다","부서 간 협업이 원천적으로 불가능한 구조다"],0,"매트릭스 조직은 기능 조직과 프로젝트/제품 조직을 결합해 구성원이 두 명의 상사에게 동시에 보고하는 이중 보고체계를 특징으로 합니다."],
["Q119","org","직무기술서(Job Description)에 일반적으로 포함되는 내용은?",["직무의 주요 과업, 책임, 요구 자격요건","직원 개인의 병역사항","직원의 가족관계","팀 회식 규칙"],0,"직무기술서는 해당 직무가 수행하는 주요 과업과 책임, 필요한 자격요건 등을 정리한 문서입니다."],
["Q120","org","통제범위(Span of Control)가 지나치게 넓을 때 발생할 수 있는 문제는?",["관리자가 구성원 개개인을 세심히 관리하기 어려워질 수 있다","조직의 의사결정 속도가 항상 빨라진다","보고 체계가 지나치게 복잡해진다","인건비가 무조건 절감된다"],0,"통제범위가 지나치게 넓으면 한 명의 관리자가 관리해야 할 인원이 많아져 세심한 코칭과 관리가 어려워질 수 있습니다."],
["Q121","org","사업부제 조직(Divisional Structure)의 장점은?",["제품·지역별로 독립적인 의사결정과 책임경영이 가능하다","전사 공통 기능의 중복을 완전히 없앤다","항상 기능식 조직보다 비용이 적게 든다","조직 규모가 작을수록 유리한 구조다"],0,"사업부제는 제품이나 지역별로 독립된 조직 단위를 구성해 각 사업부가 신속한 의사결정과 책임경영을 할 수 있게 합니다."],
["Q122","org","정원관리(TO, Table of Organization)의 목적은?",["조직의 적정 인력 규모를 계획하고 관리한다","직원의 개인 성과를 평가하는 것이다","급여 인상률을 결정하는 것이다","채용 광고 문구를 작성하는 것이다"],0,"정원관리는 조직의 사업 계획과 업무량에 맞는 적정 인력 규모를 계획하고 통제하는 활동입니다."],
["Q123","org","조직개편 시 직무분석을 선행하는 이유는?",["변경되는 직무의 역할과 책임을 명확히 정의하기 위함이다","조직개편 절차를 지연시키기 위함이다","법적으로 직무분석이 의무화되어 있기 때문이다","직무분석은 채용 시에만 필요하기 때문이다"],0,"조직개편 시 직무분석을 통해 새롭게 정의되는 직무의 역할과 책임을 명확히 해야 혼선을 줄이고 원활한 전환이 가능합니다."],
["Q124","org","아웃소싱(외주화)을 검토할 때 고려할 사항은?",["핵심 역량 여부와 비용·품질·보안 측면을 종합적으로 검토한다","무조건 비용이 저렴하면 외주화를 결정한다","핵심 업무일수록 우선적으로 외주화한다","외주화는 법적으로 전면 금지되어 있다"],0,"아웃소싱 여부는 해당 업무가 핵심 역량인지, 비용·품질·보안 측면에서 이점이 있는지를 종합적으로 검토해 결정해야 합니다."],
["Q125","org","겸직(부업) 허용 여부에 대한 일반적인 인사 원칙은?",["회사의 이해상충 및 경쟁 방지 규정을 준수하는 범위에서 검토한다","모든 겸직은 법적으로 전면 금지되어 있다","어떤 겸직이든 회사가 관여할 수 없다","겸직 여부는 임원에게만 해당하는 사안이다"],0,"겸직은 회사의 취업규칙이나 근로계약에 따라 이해상충, 경쟁업무 여부 등을 검토해 허용 여부를 판단하는 것이 일반적입니다."],
["Q126","org","조직 계층(직급 단계)을 축소하는 조직 슬림화의 목적은?",["의사결정 속도를 높이고 소통 단계를 줄인다","인건비를 무조건 늘리기 위함이다","조직의 통제를 강화하기 위함이다","직급체계를 더 복잡하게 만들기 위함이다"],0,"계층을 축소하면 보고와 의사결정 단계가 줄어들어 조직의 민첩성과 소통 속도를 높이는 데 도움이 됩니다."],
["Q127","org","직무 중심 조직설계(Job-based)와 사람 중심 조직설계(People-based)의 차이는?",["직무 중심은 역할과 직무에, 사람 중심은 개인의 역량과 성장에 상대적으로 초점을 둔다","두 방식은 동일한 개념이다","사람 중심 설계는 직무기술서를 절대 사용하지 않는다","직무 중심 설계는 소규모 조직에만 적용 가능하다"],0,"직무 중심 설계는 직무 자체의 역할과 요구사항에, 사람 중심 설계는 구성원 개인의 역량과 성장 경로에 상대적으로 더 초점을 둡니다."],
["Q128","org","신설 조직의 직무 등급(Job Grade)을 설계할 때 고려 요소는?",["직무의 난이도, 책임 범위, 필요 역량 수준","담당자의 개인적 친분","담당자의 근속연수만","담당자의 희망 연봉"],0,"직무 등급은 담당자 개인 요소가 아니라, 직무 자체의 난이도·책임 범위·요구 역량 수준 등을 기준으로 설계하는 것이 원칙입니다."],
["Q129","org","조직도(Organization Chart)가 조직 운영에서 하는 역할은?",["보고체계와 역할·책임 소재를 시각적으로 명확히 보여준다","구성원의 개인 성과를 나타낸다","연봉 정보를 표시하는 문서이다","채용 계획서를 대체하는 문서이다"],0,"조직도는 구성원 간 보고 체계와 부서별 역할·책임 소재를 한눈에 파악할 수 있게 해주는 기본적인 조직 운영 도구입니다."],
["Q130","org","애자일(Agile) 조직 운영 방식의 특징은?",["작은 단위의 팀이 빠르게 실행하고 피드백을 반영해 조정한다","한 번 수립한 계획은 절대 변경하지 않는다","의사결정을 최고경영진에만 집중시킨다","프로젝트 완료 후에만 피드백을 받는다"],0,"애자일 방식은 소규모 팀 단위로 빠르게 실행하고 짧은 주기로 피드백을 반영해 지속적으로 조정해 나가는 것이 특징입니다."],
["Q131","org","전사 조직개편 시 인사팀의 주요 역할이 아닌 것은?",["신제품의 기술 사양을 직접 설계한다","인력 재배치와 직무 전환을 지원한다","조직개편에 따른 커뮤니케이션을 지원한다","변경된 조직구조에 맞춰 직무·직급 체계를 정비한다"],0,"인사팀은 인력 재배치, 직무·직급 정비, 커뮤니케이션 지원 등을 담당하며, 제품의 기술 사양 설계는 인사팀의 역할이 아닙니다."],
["Q132","org","자회사·계열사 간 인력 파견(전출) 시 주의할 점은?",["근로조건 변경 등에 대해 근로자 동의와 법적 요건을 충족해야 한다","회사 재량으로 근로자 동의 없이 자유롭게 전출할 수 있다","전출은 법적으로 전면 금지되어 있다","전출 시에는 근로계약서를 작성할 필요가 없다"],0,"전출은 근로조건에 중대한 변경을 수반할 수 있어, 원칙적으로 근로자의 동의와 관련 법적 요건을 충족해야 합니다."],
["Q133","org","조직 내 직책자(팀장 등)와 직급의 차이는?",["직책은 맡은 역할(보직)을, 직급은 조직 내 서열 단계를 의미한다","직책과 직급은 완전히 동일한 개념이다","직책은 급여와 무관하게 결정될 수 없다","직급이 높으면 항상 특정 직책을 맡아야 한다"],0,"직책은 팀장, 실장처럼 맡은 역할(보직)을 의미하고, 직급은 조직 내 서열 체계를 나타내는 것으로 서로 다른 개념입니다."],
["Q134","org","조직 리밸런싱(인력 재배치)을 진행할 때 고려할 점은?",["사업 우선순위 변화와 구성원의 역량·의견을 함께 반영한다","경영진의 일방적 지시만으로 신속히 처리한다","기존 인력 배치는 절대 변경하지 않는다","리밸런싱은 법적으로 금지되어 있다"],0,"인력 재배치는 사업 우선순위 변화를 반영하되, 구성원의 역량과 의견을 함께 고려해야 수용성과 실행력이 높아집니다."],
["Q135","org","스타트업이 성장하면서 조직구조를 재정비하는 이유는?",["인력 규모가 커지면서 이전의 단순한 구조로는 소통·관리에 한계가 생기기 때문이다","조직구조는 회사 규모와 무관하게 항상 동일해야 하기 때문이다","조직 재정비는 법적 의무 사항이기 때문이다","외부 컨설팅 비용을 늘리기 위함이다"],0,"조직 규모가 커지면 초기의 단순한 구조로는 소통과 의사결정에 한계가 생기므로, 성장 단계에 맞는 구조 재정비가 필요합니다."],
["Q136","analytics","이직률(Turnover Rate)을 계산하는 일반적인 방식은?",["일정 기간 퇴사자 수를 평균 재직 인원 수로 나눈 값이다","전체 채용 인원 대비 합격자 비율이다","연봉 인상률과 동일한 개념이다","입사자 수에서 퇴사자 수를 뺀 값이다"],0,"이직률은 통상 특정 기간의 퇴사자 수를 해당 기간의 평균 재직 인원 수로 나누어 백분율로 산출합니다."],
["Q137","analytics","채용전환율(합격률)을 활용하는 목적은?",["채용 프로세스 단계별 병목 구간을 파악한다","연봉 협상 결과만을 확인하기 위함이다","교육 만족도를 측정하기 위함이다","퇴사자 수를 집계하기 위함이다"],0,"채용전환율은 지원부터 합격까지 단계별 전환 비율을 분석해 어느 단계에서 이탈이 많은지 파악하는 데 활용됩니다."],
["Q138","analytics","급여 등 민감한 인사 데이터를 다룰 때 가장 중요한 원칙은?",["접근 권한을 최소화하고 보안 절차를 철저히 준수한다","누구나 쉽게 조회할 수 있도록 공유한다","데이터를 백업 없이 개인 PC에만 저장한다","보안보다 분석 속도를 항상 우선시한다"],0,"급여, 평가 등 민감한 인사 데이터는 접근 권한을 최소화하고 개인정보보호 및 보안 절차를 철저히 지켜야 합니다."],
["Q139","analytics","헤드카운트(Headcount) 리포트에 일반적으로 포함되는 정보는?",["부서별 인원 현황과 증감 추이","개별 직원의 건강검진 결과","직원 개인의 정치 성향","경쟁사의 인사 정책"],0,"헤드카운트 리포트는 부서별·직급별 인원 현황과 시점별 증감 추이를 파악하기 위한 대표적인 인사 데이터 리포트입니다."],
["Q140","analytics","퇴사 원인 분석을 위해 활용할 수 있는 방법은?",["퇴사자 인터뷰와 설문 데이터를 함께 분석한다","퇴사자와의 접촉을 전혀 시도하지 않는다","동일한 원인이라고 미리 단정하고 분석을 생략한다","퇴사 원인은 분석할 필요가 없다"],0,"퇴사 원인은 퇴사자 인터뷰, 설문, 근속 데이터 등을 종합적으로 분석해야 실제 조직 개선에 유의미한 시사점을 얻을 수 있습니다."],
["Q141","analytics","설문 조사에서 무응답률이 매우 높을 때 우선 점검할 사항은?",["설문 설계·전달 방식과 구성원의 신뢰 수준을 함께 점검한다","무조건 표본을 늘리면 해결된다","결과를 그대로 신뢰하고 발표한다","응답자에게 불이익을 준다"],0,"무응답률이 높다면 설문 문항 설계, 전달 방식, 익명성에 대한 신뢰 등 다양한 원인을 점검해야 합니다."],
["Q142","analytics","피플애널리틱스 프로젝트를 시작할 때 가장 먼저 정의해야 하는 것은?",["분석을 통해 해결하고자 하는 인사 이슈(목적)","사용할 통계 프로그램의 종류","보고서 색상 테마","분석팀 회식 일정"],0,"데이터 분석에 앞서 무엇을 알고 싶은지, 어떤 인사 이슈를 해결하려는지 목적을 명확히 정의하는 것이 가장 중요한 출발점입니다."],
["Q143","analytics","조직 내 승진 소요연수 데이터를 분석하는 목적은?",["승진 체계의 공정성과 적정성을 점검한다","개인의 사생활을 조사하기 위함이다","급여 총액을 계산하기 위함이다","채용 브랜드를 홍보하기 위함이다"],0,"승진 소요연수 분석은 특정 집단 간 승진 속도 차이 등을 통해 승진 체계의 공정성과 운영 적정성을 점검하는 데 활용됩니다."],
["Q144","analytics","정성적 데이터(인터뷰, 서술형 응답 등)와 정량적 데이터를 함께 분석하는 이유는?",["숫자로 드러나지 않는 맥락과 원인을 함께 이해할 수 있다","정성적 데이터는 분석할 가치가 전혀 없기 때문이다","정량 데이터만으로 항상 충분하기 때문이다","두 데이터를 섞으면 분석이 무효화되기 때문이다"],0,"정량 데이터가 '무엇이' 일어났는지를 보여준다면, 정성 데이터는 '왜' 그런 결과가 나왔는지 맥락을 이해하는 데 도움을 줍니다."],
["Q145","analytics","인사 대시보드를 설계할 때 고려할 점은?",["의사결정에 실제로 필요한 핵심 지표 위주로 구성한다","가능한 모든 지표를 빠짐없이 전부 나열한다","디자인 화려함을 최우선으로 고려한다","매번 지표 정의를 바꿔서 표시한다"],0,"효과적인 대시보드는 의사결정자가 실제로 필요로 하는 핵심 지표를 선별해 명확하게 전달하는 것이 중요합니다."],
["Q146","analytics","채용 소요기간(Time to Hire)을 단축하기 위해 분석해야 할 구간은?",["공고 게시부터 최종 합격까지 단계별 소요 시간","합격자의 입사 후 1년 성과","퇴사자의 평균 근속연수","경쟁사의 매출액"],0,"채용 소요기간을 줄이려면 공고, 서류, 면접, 처우협의 등 단계별로 어디서 시간이 지연되는지 분석해야 합니다."],
["Q147","analytics","특정 부서의 이직률이 유독 높게 나타날 때 인사담당자가 취할 접근은?",["해당 부서의 근무 환경, 리더십, 보상 등 다각도 원인을 살펴본다","우연이라 여기고 별도 분석 없이 넘어간다","해당 부서원 전체를 즉시 교체한다","이직률 수치 자체를 공개하지 않는다"],0,"특정 부서의 이직률이 두드러진다면 리더십, 업무강도, 보상 등 다양한 요인을 다각도로 살펴 원인을 규명하는 것이 필요합니다."],
["Q148","analytics","인사 데이터 분석 결과를 경영진에게 보고할 때 유의할 점은?",["데이터의 한계와 해석의 전제를 함께 설명한다","숫자만 있으면 맥락 설명은 생략해도 된다","항상 긍정적인 결과만 선별해 보고한다","분석 방법은 비밀로 하고 결과만 전달한다"],0,"데이터에는 표본 크기, 수집 방식 등의 한계가 있을 수 있으므로, 해석의 전제와 한계를 함께 설명하는 것이 바람직합니다."],
["Q149","analytics","조직 내 성별 임금 격차를 분석할 때 함께 고려해야 할 변수는?",["직급, 근속연수, 직무 등 임금에 영향을 주는 다른 요인들","분석 대상자의 개인 취미","분석 대상자의 거주지 아파트 평수","분석과 무관한 회사 로고 색상"],0,"단순 평균 비교만으로는 왜곡될 수 있어, 직급·근속·직무 등 임금에 영향을 미치는 다른 변수를 통제한 분석이 필요합니다."],
["Q150","analytics","인사 데이터의 정확성을 유지하기 위해 필요한 활동은?",["데이터 입력 기준을 표준화하고 정기적으로 검증한다","한번 입력한 데이터는 절대 재확인하지 않는다","여러 시스템에 제각각 다른 기준으로 입력해도 무방하다","데이터 오류는 발견되어도 수정하지 않는다"],0,"인사 데이터의 신뢰도를 유지하려면 입력 기준을 표준화하고, 정기적인 검증과 정합성 점검이 필요합니다."],
["Q151","analytics","조직의 다양성 지표(성별, 연령 분포 등)를 정기적으로 모니터링하는 목적은?",["다양성 관련 현황과 변화 추이를 파악해 정책에 반영한다","특정 집단을 차별하기 위한 근거자료로 쓰기 위함이다","법적 의무와 무관하게 형식적으로만 수집한다","다양성 지표는 활용 가치가 전혀 없다"],0,"다양성 지표를 모니터링하면 조직의 현황과 변화 추이를 파악해 채용·육성 등 관련 정책 수립에 참고할 수 있습니다."],
["Q152","analytics","설문 응답의 익명성을 보장해야 하는 이유는?",["솔직한 응답을 유도해 데이터의 신뢰도를 높일 수 있다","익명성은 데이터 분석에 불필요한 요소다","응답자를 특정하기 쉽게 하기 위함이다","익명 설문은 법적으로 금지되어 있다"],0,"익명성이 보장되지 않으면 응답자가 불이익을 우려해 솔직하지 않은 답변을 할 가능성이 높아져 데이터 신뢰도가 떨어집니다."],
["Q153","analytics","인사 지표를 시계열(추세)로 분석하는 것이 중요한 이유는?",["단일 시점 수치만으로는 알기 어려운 변화의 방향과 속도를 파악할 수 있다","시계열 분석은 법적으로 요구되는 절차이기 때문이다","한 시점의 데이터만 보는 것이 항상 더 정확하기 때문이다","추세 분석은 채용에만 활용되기 때문이다"],0,"시계열 분석을 통해 단순 스냅샷으로는 알 수 없는 추세와 변화 속도를 파악할 수 있어 선제적 대응이 가능해집니다."],
["Q154","analytics","조직 내 관리자 대비 실무자 비율(관리 스팬 지표)을 분석하는 목적은?",["조직 구조의 효율성과 관리 부담의 적정성을 점검한다","개별 직원의 성과 등급을 산정하기 위함이다","급여 총액을 계산하기 위함이다","채용 공고 문구를 작성하기 위함이다"],0,"관리자 대비 실무자 비율을 분석하면 조직이 지나치게 계층적이거나 관리 부담이 과도한지 등을 점검할 수 있습니다."],
["Q155","perf","성과관리에서 목표의 정렬(Alignment)이 중요한 이유는?",["개인·팀 목표가 조직 전체 목표와 연결되어야 성과가 조직 성과로 이어진다","목표는 서로 무관하게 설정해도 무방하다","정렬은 임원 목표에만 해당하는 개념이다","목표 정렬은 평가 결과에 영향을 주지 않는다"],0,"개인과 팀의 목표가 조직 전체 목표와 정렬될 때, 개별 성과가 모여 조직의 성과로 이어질 수 있습니다."],
["Q156","comp","호봉제와 직무급제의 차이는?",["호봉제는 근속연수를, 직무급제는 직무의 가치를 임금 결정의 주된 기준으로 삼는다","두 제도는 완전히 동일한 개념이다","직무급제는 근속연수만으로 임금을 결정하는 제도다","호봉제는 성과와 무관하게 절대 운영될 수 없다"],0,"호봉제는 근속연수에 따라 임금이 상승하는 구조이고, 직무급제는 수행하는 직무의 가치와 난이도를 기준으로 임금을 결정하는 구조입니다."],

const _mCache = {};
const _mOutline='#2b2018';
const _mBrowVariants={goblin:1,wolf:1,dragon:1};
/* 타원(원형) 실루엣을 1px 행 단위로 채우는 기본 도형 — 라운드한 치비 몸통/머리용 */
function _ovalRow(rows, r, maxW){
  const mid=(rows-1)/2;
  const t=(r-mid)/(rows/2);
  const ratio=Math.sqrt(Math.max(0,1-t*t));
  return Math.max(1, Math.round(maxW*ratio));
}
function _ovalShape(g,cx,yTop,rows,maxW,skin,shadow){
  g.fillStyle=_mOutline;
  for(let r=-1;r<=rows;r++){
    const w=_ovalRow(rows+2, r+1, maxW+2);
    g.fillRect(cx-Math.floor(w/2), yTop+r, w, 1);
  }
  for(let r=0;r<rows;r++){
    const w=_ovalRow(rows, r, maxW);
    g.fillStyle=skin;
    g.fillRect(cx-Math.floor(w/2), yTop+r, w, 1);
  }
  for(let r=Math.ceil(rows*0.5); r<rows; r++){
    const w=_ovalRow(rows, r, maxW);
    const shW=Math.round(w*0.5);
    g.fillStyle=shadow;
    g.fillRect(cx-Math.floor(w/2)+ (w-shW), yTop+r, shW, 1);
  }
}
function _mStair(g,x0,y0,rows,w0,dw,dir,skin,shadow){
  for(let i=0;i<rows;i++){
    const w=Math.max(1,Math.round(w0+dw*i));
    const x = dir<0 ? x0-w : x0;
    g.fillStyle=_mOutline; g.fillRect(x-1,y0+i,w+2,1);
  }
  for(let i=0;i<rows;i++){
    const w=Math.max(1,Math.round(w0+dw*i));
    const x = dir<0 ? x0-w : x0;
    g.fillStyle= i>rows*0.5 ? shadow : skin;
    g.fillRect(x,y0+i,w,1);
  }
}
function _mFace(g, art, cx, eyeY, small){
  const ew = small?5:6, eh=small?6:8, gap=small?6:9;
  g.fillStyle='#ffffff';
  g.fillRect(cx-gap-ew, eyeY, ew, eh); g.fillRect(cx+gap, eyeY, ew, eh);
  g.fillStyle=_mOutline;
  g.fillRect(cx-gap-ew, eyeY, ew, 1); g.fillRect(cx+gap, eyeY, ew, 1);
  g.fillStyle=art.eye;
  g.fillRect(cx-gap-ew+1, eyeY+3, ew-2, eh-3); g.fillRect(cx+gap+1, eyeY+3, ew-2, eh-3);
  g.fillStyle='#ffffff';
  g.fillRect(cx-gap-ew+1, eyeY+3, 1, 1); g.fillRect(cx+gap+1, eyeY+3, 1, 1);
  g.fillStyle='rgba(232,120,110,.55)';
  g.fillRect(cx-gap-ew-3, eyeY+eh-2, 3, 2); g.fillRect(cx+gap+ew+2, eyeY+eh-2, 3, 2);
  g.fillStyle=_mOutline;
  g.fillRect(cx-3, eyeY+eh+2, 6, 2);
}
/* 화난/야성적인 몬스터용 눈썹 - 소소풍 순둥한 눈과 대비되는 각진 액센트 */
function _mBrow(g,cx,eyeY,gap,ew){
  g.fillStyle=_mOutline;
  g.fillRect(cx-gap-ew-1, eyeY-4, ew+2, 2);
  g.fillRect(cx+gap-1, eyeY-4, ew+2, 2);
}
function _paintMonster(g, art){
  const cx=20;
  if(art.variant==='slime'){
    _ovalShape(g,cx,9,33,33,art.skin,art.shadow);
    g.fillStyle=art.hi; g.fillRect(cx-11,14,6,5);
    _mFace(g, art, cx, 23, false);
    return;
  }
  if(art.variant==='mushroom'){
    _ovalShape(g,cx,26,17,21,'#ecdfd2','#cdbca8'); // 줄기
    g.fillStyle=art.skin;
    for(let r=0;r<17;r++){ const w=_ovalRow(30,r,39); g.fillRect(cx-Math.floor(w/2), r, w, 1); }
    g.fillStyle=art.shadow; g.fillRect(0,14,39,3);
    g.fillStyle=_mOutline; g.fillRect(0,15,39,2);
    g.fillStyle=art.hi; [-12,0,12].forEach(o=>g.fillRect(cx+o-2,5,5,5));
    _mFace(g, art, cx, 30, true);
    return;
  }
  const hasLegs = art.variant!=='ghost';
  if(hasLegs){
    _ovalShape(g,cx-6,36,8,9,art.skin,art.shadow);
    _ovalShape(g,cx+6,36,8,9,art.skin,art.shadow);
  }
  _ovalShape(g,cx-15,26,12,11,art.skin,art.shadow);
  _ovalShape(g,cx+15,26,12,11,art.skin,art.shadow);
  if(art.variant==='ghost'){
    g.globalAlpha=0.78;
    _ovalShape(g,cx,21,20,26,art.skin,art.shadow);
    g.globalAlpha=1;
    g.clearRect(0,36,40,10);
    g.globalAlpha=0.78;
    for(let i=0;i<5;i++){
      const wy=36+((i%2)*3);
      _ovalShape(g, cx-12+i*6, wy, 9-((i%2)*3), 8, art.skin, art.shadow);
    }
    g.globalAlpha=1;
  } else {
    _ovalShape(g,cx,23,17,23,art.skin,art.shadow);
  }
  switch(art.variant){
    case 'goblin':
      _mStair(g,11,-2,11,8,-0.55,-1,art.skin,art.shadow);
      _mStair(g,29,-2,11,8,-0.55,1,art.skin,art.shadow);
      break;
    case 'wolf':
      _mStair(g,12,-5,12,6,-0.4,-1,art.skin,art.shadow);
      _mStair(g,27,-5,12,6,-0.4,1,art.skin,art.shadow);
      _mStair(g,6,30,9,6,-0.35,-1,art.skin,art.shadow);
      break;
    case 'bat':
      _mStair(g,3,15,15,12,0.9,-1,art.skin,art.shadow);
      _mStair(g,36,15,15,12,0.9,1,art.skin,art.shadow);
      _mStair(g,14,-2,9,5,-0.35,-1,art.skin,art.shadow);
      _mStair(g,26,-2,9,5,-0.35,1,art.skin,art.shadow);
      break;
    case 'dragon':
      _mStair(g,0,12,20,15,1.0,-1,art.skin,art.shadow);
      _mStair(g,40,12,20,15,1.0,1,art.skin,art.shadow);
      _mStair(g,5,33,9,6,-0.3,-1,art.skin,art.shadow);
      _mStair(g,14,-3,5,5,-0.5,-1,art.hi,art.shadow);
      _mStair(g,26,-3,5,5,-0.5,1,art.hi,art.shadow);
      break;
    case 'golem':
      g.fillStyle=art.shadow;
      g.fillRect(14,21,1,8); g.fillRect(24,26,6,1); g.fillRect(17,30,1,5);
      break;
    case 'lich':
      _ovalShape(g,cx,-3,30,36,art.shadow,art.shadow);
      break;
    case 'hydra':
      _ovalShape(g,5,14,17,17,art.skin,art.shadow);
      g.fillStyle=art.eye; g.fillRect(3,18,3,3);
      break;
    default: break;
  }
  _ovalShape(g,cx,0,26,30,art.skin,art.shadow);
  if(art.hi) { g.fillStyle=art.hi; g.fillRect(cx-11,5,6,5); }
  if(art.variant==='goblin'){
    g.fillStyle='#f5f0e6'; g.fillRect(cx-4,18,1,3); g.fillRect(cx+3,18,1,3);
  }
  if(art.variant==='lich'){
    g.fillStyle='#14100c'; g.fillRect(cx-11,12,8,8); g.fillRect(cx+3,12,8,8);
    g.fillStyle=art.eye; g.fillRect(cx-8,15,1,1); g.fillRect(cx+6,15,1,1);
  } else {
    _mFace(g, art, cx, 12, false);
    if(_mBrowVariants[art.variant]) _mBrow(g, cx, 12, 9, 6);
  }
}
function drawMonster(ctx, id){
  const art = MONSTER_ART[id] || MONSTER_ART.m1;
  const GW=40, GH=46;
  let off=_mCache[id];
  if(!off){
    off=document.createElement('canvas'); off.width=GW; off.height=GH;
    _mCache[id]=off;
  }
  const g=off.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.clearRect(0,0,GW,GH); g.globalAlpha=1;
  _paintMonster(g, art);
  if(art.boss){
    g.globalAlpha=1; g.fillStyle='#e8a93c';
    g.fillRect(14,-2,3,5); g.fillRect(18,-3,3,6); g.fillRect(23,-2,3,5);
    g.fillStyle=_mOutline;
    g.fillRect(12,-3,15,1);
  }
  const W=120,H=120;
  ctx.clearRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;
  const scale = art.boss ? 2.55 : 2.5;
  const dw=GW*scale, dh=GH*scale;
  const dy = Math.max(2, H-dh-2);
  ctx.drawImage(off, (W-dw)/2, dy, dw, dh);
}

function pickRewardItems(n){
  const weighted=[];
  ITEMS.forEach(it=>{
    const w = it.rarity==='common'?60: it.rarity==='rare'?32:8;
    weighted.push({it,w});
  });
  const pool=[...ITEMS];
  const out=[];
  while(out.length<n && pool.length){
    let total=0; const cand=pool.map(it=>{const w=it.rarity==='common'?60:it.rarity==='rare'?32:8; total+=w; return {it,w};});
    let r=Math.random()*total, chosen=cand[0].it;
    for(const c of cand){ if(r<c.w){chosen=c.it;break;} r-=c.w; }
    out.push(chosen);
    pool.splice(pool.indexOf(chosen),1);
  }
  return out;
}

/* =========================================================
   사운드 — 외부 음원 파일 없이 Web Audio API로 직접 합성.
   인트로(탐험) 테마는 잔잔한 장조, 전투 테마는 빠른 단조로
   게임 톤에 맞춰 절차적으로 생성한다.
   ========================================================= */
const SND = (function(){
  let ctx=null, master=null, muted=false, currentBgm=null, bgmTimer=null, curAct=1, started=false;
  let bgmNodes=[];
  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.34;
      master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(freq, start, dur, type='square', gain=0.16, opt={}){
    if(!ctx) return;
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
    if(opt.detune) osc.detune.setValueAtTime(opt.detune, ctx.currentTime+start);
    const attack = opt.attack!=null ? opt.attack : 0.01;
    g.gain.setValueAtTime(0, ctx.currentTime+start);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime+start+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
    let last=g;
    if(opt.lowpass){
      const f=ctx.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(opt.lowpass, ctx.currentTime+start);
      if(opt.sweepTo) f.frequency.linearRampToValueAtTime(opt.sweepTo, ctx.currentTime+start+dur);
      f.Q.value = opt.q||0.8;
      last.connect(f); last=f;
    }
    osc.connect(g); last.connect(master);
    osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.02);
    if(opt.reg) opt.reg.push(osc);
  }
  /* 살짝 디튠된 오실레이터 3개를 겹쳐 현악/합창처럼 두툼하게 만드는 코드 톤 (보스전용) */
  function chordTone(freq, start, dur, gain=0.09, lowpass=null, reg=null){
    [-6,0,6].forEach(det=>tone(freq,start,dur,'sawtooth',gain/3,{detune:det, attack:0.12, lowpass, q:0.6, reg}));
  }
  function noiseBurst(start, dur, gain=0.14, lowpass=null, reg=null){
    if(!ctx) return;
    const n=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=ctx.createGain();
    g.gain.setValueAtTime(gain, ctx.currentTime+start);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
    let last=g;
    if(lowpass){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lowpass; last.connect(f); last=f; }
    src.connect(g); last.connect(master);
    src.start(ctx.currentTime+start);
    if(reg) reg.push(src);
  }
  /* ---- 효과음 (기존 유지) ---- */
  function sfxSelect(){ if(muted||!ensureCtx()) return; tone(520,0,0.06,'square',0.10); tone(760,0.05,0.07,'square',0.09); }
  function sfxCorrect(){ if(muted||!ensureCtx()) return; tone(660,0,0.09,'triangle',0.17); tone(880,0.08,0.12,'triangle',0.17); tone(1100,0.16,0.16,'triangle',0.15); }
  function sfxWrong(){ if(muted||!ensureCtx()) return; tone(220,0,0.16,'sawtooth',0.15); tone(160,0.1,0.22,'sawtooth',0.13); }
  function sfxTick(){ if(muted||!ensureCtx()) return; tone(1300,0,0.03,'square',0.05); }
  function sfxVictory(){ if(muted||!ensureCtx()) return; [523,659,784,1047].forEach((f,i)=>tone(f,i*0.11,0.16,'triangle',0.15)); }
  function sfxDefeat(){ if(muted||!ensureCtx()) return; [392,330,262,196].forEach((f,i)=>tone(f,i*0.16,0.22,'sawtooth',0.13)); }
  function sfxImpactLight(){ if(muted||!ensureCtx()) return; noiseBurst(0,0.06,0.12); tone(300,0,0.06,'square',0.08); }
  function sfxImpactHeavy(){ if(muted||!ensureCtx()) return; noiseBurst(0,0.1,0.18); tone(120,0,0.12,'square',0.12); }
  /* ---- 배경음: 탐험/대기 화면 (밝은 칩튠 멜로디) ---- */
  const introMelody=[[523,1],[659,1],[784,1],[659,1],[587,1],[698,1],[880,2],[659,1],[784,1],[988,1],[784,1],[698,1],[880,1],[1047,2]];
  const introBass=[196,196,220,196];
  function scheduleIntro(){
    if(muted||currentBgm!=='intro'||!ensureCtx()) return;
    const beat=0.32; let t=0;
    introMelody.forEach(([f,len])=>{ tone(f,t,beat*len*0.9,'triangle',0.09,{reg:bgmNodes}); t+=beat*len; });
    introBass.forEach((f,i)=>tone(f,i*(t/introBass.length),(t/introBass.length)*0.85,'sine',0.05,{reg:bgmNodes}));
    bgmTimer=setTimeout(scheduleIntro, t*1000);
  }
  /* ---- 배경음: 전투 (저음 압박감, ACT에 따라 강도↑) ---- */
  function scheduleBattle(){
    if(muted||currentBgm!=='battle'||!ensureCtx()) return;
    const act=curAct;
    const beat = 0.5 - (act-1)*0.06;           // ACT 오를수록 펄스가 빨라짐
    const bassGain = 0.1 + (act-1)*0.035;      // ACT 오를수록 저음이 두꺼워짐
    const bassFreq = 55 - (act-1)*4;           // 살짝 더 낮고 무겁게
    let t=0;
    const pulses=8;
    for(let i=0;i<pulses;i++){
      // 심장박동처럼 낮은 드론 + 타격감 있는 펄스
      tone(bassFreq, t, beat*0.9, 'sine', bassGain, {attack:0.02, reg:bgmNodes});
      tone(bassFreq*1.5, t, beat*0.5, 'triangle', bassGain*0.5, {attack:0.02, reg:bgmNodes});
      noiseBurst(t, 0.04, 0.06+ (act-1)*0.02, 800, bgmNodes);
      if(i%2===1) noiseBurst(t+beat*0.5, 0.03, 0.035, 5000, bgmNodes); // 하이햇 느낌의 째깍임
      t += beat;
    }
    bgmTimer=setTimeout(scheduleBattle, t*1000);
  }
  /* ---- 배경음: 보스전 (웅장하게) ---- */
  const bossProg=[164.8, 196, 220, 174.6]; // Gm - low - Am - low, 장중한 진행
  function scheduleBoss(){
    if(muted||currentBgm!=='boss'||!ensureCtx()) return;
    const beat=0.85; let t=0;
    bossProg.forEach((f,i)=>{
      chordTone(f, t, beat*1.9, 0.17, 1400, bgmNodes);           // 디튠 3중 합창 코드 (현악 느낌 = 웅장함)
      tone(f/2, t, beat*1.9, 'sine', 0.15, {attack:0.05, reg:bgmNodes}); // 묵직한 저음 베이스
      if(i%2===0) tone(f*2, t+beat*0.15, 0.22, 'sawtooth', 0.065, {attack:0.01, lowpass:2200, sweepTo:600, reg:bgmNodes}); // 브라스풍 스탭
      noiseBurst(t, 0.08, 0.1, 700, bgmNodes); // 팀파니 느낌의 저역 타격
      // 급박한 8분음표 저음 펄스 (긴장감) - 코드 위에 겹쳐서 압박감 추가
      for(let p=0;p<4;p++){
        tone(f/4, t+p*(beat/2), beat/2*0.6, 'square', 0.045, {attack:0.005, reg:bgmNodes});
      }
      t += beat*2;
    });
    bgmTimer=setTimeout(scheduleBoss, t*1000);
  }
  function stopBgmTimer(){
    if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer=null; }
    if(bgmNodes.length){
      bgmNodes.forEach(n=>{ try{n.stop(0);}catch(e){} try{n.disconnect();}catch(e){} });
      bgmNodes=[];
    }
  }
  function playIntro(){ if(!ensureCtx()||currentBgm==='intro') return; started=true; stopBgmTimer(); currentBgm='intro'; scheduleIntro(); }
  function playBattle(act){ curAct=act||1; if(!ensureCtx()){ return; } started=true; if(currentBgm==='battle'){ return; } stopBgmTimer(); currentBgm='battle'; scheduleBattle(); }
  function playBoss(){ if(!ensureCtx()||currentBgm==='boss') return; started=true; stopBgmTimer(); currentBgm='boss'; scheduleBoss(); }
  function setMuted(v){
    muted=v;
    if(muted){ stopBgmTimer(); }
    else if(currentBgm==='intro'){ scheduleIntro(); }
    else if(currentBgm==='battle'){ scheduleBattle(); }
    else if(currentBgm==='boss'){ scheduleBoss(); }
    else { playIntro(); } // 아직 아무 테마도 재생된 적 없으면 탐험 테마부터 시작
  }
  function isMuted(){ return muted; }
  function hasStarted(){ return started; }
  return { ensureCtx, playIntro, playBattle, playBoss, setMuted, isMuted, hasStarted,
    sfxSelect, sfxCorrect, sfxWrong, sfxTick, sfxVictory, sfxDefeat, sfxImpactLight, sfxImpactHeavy };
})();

function hasItem(type){ return G.items.some(i=>i.type===type); }
function itemVal(type,def=0){ const it=G.items.find(i=>i.type===type); return it? (it.val!==undefined?it.val:def) : def; }
function itemSum(type){ return G.items.filter(i=>i.type===type).reduce((s,i)=>s+(i.val||0),0); }

/* =========================================================
   맵 생성
   ========================================================= */
function generateMap(act){
  const levels=[];
  for(let lv=1; lv<=9; lv++){
    const count = lv===1 ? 3 : (2 + (lv%2===0?1:0)); // 2~3개
    let types;
    if(lv===1){
      // 초기 선택지는 무조건 몬스터 조우
      types = Array(count).fill('battle');
    } else {
      // 실제 타입은 해당 단계에 도달했을 때(안개 해제 시) 결정됨
      types = Array(count).fill('fog');
    }
    const nodes = types.map((type,i)=>({id:`a${act}_l${lv}_${i}`, level:lv, idx:i, type, done:false}));
    levels.push(nodes);
  }
  levels.push([{id:`a${act}_boss`, level:10, idx:0, type:'boss', done:false}]);
  // connections: each node in level i connects to 1-2 nodes in level i+1 with close idx
  for(let lv=0; lv<levels.length-1; lv++){
    const cur=levels[lv], next=levels[lv+1];
    const nextIncoming = new Set();
    cur.forEach(n=>{
      const ratio = n.idx/(Math.max(cur.length-1,1));
      const targetIdx = Math.round(ratio*(next.length-1));
      const conns = new Set([targetIdx]);
      if(next.length>1 && Math.random()<0.5){
        conns.add(Math.max(0,Math.min(next.length-1, targetIdx + (Math.random()<0.5?-1:1))));
      }
      n.next = [...conns];
      conns.forEach(c=>nextIncoming.add(c));
    });
    next.forEach((n,i)=>{
      if(!nextIncoming.has(i)){
        // 고아 노드 방지: 가장 가까운 이전 노드에 연결 추가
        let closest=cur[0]; let bd=999;
        cur.forEach(c=>{ const d=Math.abs(c.idx-i); if(d<bd){bd=d; closest=c;} });
        closest.next.push(i);
      }
    });
  }
  return {act, levels, startLevel:0};
}
function weightedType(w){
  const entries=Object.entries(w);
  const total=entries.reduce((s,[,v])=>s+v,0);
  let r=Math.random()*total;
  for(const [k,v] of entries){ if(r<v) return k; r-=v; }
  return entries[0][0];
}
function weightedTypeExcl(exclList){
  const weights={battle:40, unknown:25, treasure:15, rest:20};
  exclList.forEach(k=>delete weights[k]);
  return weightedType(weights);
}
/* 몬스터를 최소 3회 조우하기 전에는 보물(아이템) 노드가 나오지 않도록 단계별 타입을
   실제로 도달했을 때 결정한다(안개 해제). 항상 전투 1개는 보장한다. */
function ensureLevelRevealed(act){
  const map=G.maps[act]; const prog=G.progress[act];
  const rowIdx=prog.level;
  if(rowIdx>=map.levels.length) return;
  const row=map.levels[rowIdx];
  if(!row.some(n=>n.type==='fog')) return;
  const kills = prog.kills||0;
  const allowTreasure = kills>=3;
  const count=row.length;
  let types=['battle'];
  types.push(allowTreasure ? 'treasure' : weightedTypeExcl(['treasure']));
  for(let i=2;i<count;i++){
    types.push(weightedTypeExcl(allowTreasure?[]:['treasure']));
  }
  types=types.sort(()=>Math.random()-0.5);
  row.forEach((n,i)=>{ n.type=types[i]; });
}

  if(act===2) G.player.baseAtk += 5;
  if(act===3) G.player.baseAtk += 7;
  G.screen='map';
  renderMap();
}
function reachableLevel(){ return G.progress[G.act].level; }

function getAllowedIds(map, prog){
  if(prog.visited.length===0){
    return new Set(map.levels[0].map(n=>n.id));
  }
  const lastId=prog.visited[prog.visited.length-1];
  const lastNode=findNode(lastId);
  const targetRow=map.levels[prog.level];
  if(!lastNode || !targetRow) return new Set();
  return new Set((lastNode.next||[]).map(idx=>targetRow[idx]&&targetRow[idx].id).filter(Boolean));
}
function drawMapLines(map,prog,allowedIds){
  const svg=document.getElementById('mapSvg');
  const scroll=document.getElementById('mapScroll');
  if(!svg||!scroll) return;
  const scRect=scroll.getBoundingClientRect();
  svg.setAttribute('width', scRect.width);
  svg.setAttribute('height', scRect.height);
  let paths='';
  map.levels.forEach((row,lv)=>{
    if(lv===map.levels.length-1) return;
    row.forEach(n=>{
      const fromEl=document.querySelector(`.node-btn[data-id="${n.id}"]`);
      if(!fromEl) return;
      const fr=fromEl.getBoundingClientRect();
      const fx=fr.left+fr.width/2-scRect.left, fy=fr.top+fr.height-scRect.top;
      (n.next||[]).forEach(ni=>{
        const target=map.levels[lv+1][ni];
        if(!target) return;
        const toEl=document.querySelector(`.node-btn[data-id="${target.id}"]`);
        if(!toEl) return;
        const tr=toEl.getBoundingClientRect();
        const tx=tr.left+tr.width/2-scRect.left, ty=tr.top-scRect.top;
        const done = prog.visited.includes(n.id) && prog.visited.includes(target.id);
        const isCurrentChoice = prog.visited.includes(n.id) && allowedIds && allowedIds.has(target.id) && lv+1===prog.level;
        const active = done || isCurrentChoice;
        paths+=`<line x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" stroke="${done?'#F0C766':'#D9C08C'}" stroke-width="2.5" stroke-dasharray="6,6" opacity="${active?0.9:0.22}"/>`;
      });
    });
  });
  svg.innerHTML=paths;
}
function positionPlayerToken(map,prog){
  const scroll=document.getElementById('mapScroll');

  const lv=Math.min(prog.level, map.levels.length-1);

function markVisited(nodeId, level){
  const prog=G.progress[G.act];
  prog.visited.push(nodeId);
  prog.level = level+1;
}
function findNode(nodeId){
  const map=G.maps[G.act];
  for(const row of map.levels) for(const n of row) if(n.id===nodeId) return n;
}
function enterNode(nodeId, level){
  const node=findNode(nodeId);
  if(node.type==='battle'){
    const pool=MONSTERS[G.act];
    const m=pool[Math.floor(Math.random()*pool.length)];
    startBattle({...m}, ()=>{ markVisited(nodeId,level); afterNodeResolved(); });
  } else if(node.type==='boss'){
    const b=BOSSES[G.act];
    startBattle({...b}, ()=>{ markVisited(nodeId,level); onBossDefeated(); });
  } else if(node.type==='treasure'){
    markVisited(nodeId,level);
    showTreasure(()=>afterNodeResolved());
  } else if(node.type==='rest'){
    markVisited(nodeId,level);
    showRest(()=>afterNodeResolved());
  } else if(node.type==='unknown'){
    markVisited(nodeId,level);
    resolveUnknown(()=>afterNodeResolved());
  }
}
function afterNodeResolved(){
  G.screen='map'; renderMap();
}

/* =========================================================
   전투
   ========================================================= */
function pickQuestion(topics, act){
  const level = act;
  let pool = QUESTIONS.filter(q=>topics.includes(q[1]) && !G.usedQuestionIds.has(q[0]));
  if(pool.length===0){
    G.usedQuestionIds.clear();
    pool = QUESTIONS.filter(q=>topics.includes(q[1]));
  }
  const q = pool[Math.floor(Math.random()*pool.length)];
  G.usedQuestionIds.add(q[0]);
  return shuffleQuestionOptions(q);
}
/* 정답이 특정 번호(주로 1번)에 몰리지 않도록 매번 보기 순서를 랜덤으로 섞는다.
   원본 QUESTIONS 데이터는 건드리지 않고 새 배열을 반환한다. */
function shuffleQuestionOptions(q){
  const order=[0,1,2,3];
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  const newOptions = order.map(i=>q[3][i]);
  const newAnswerIdx = order.indexOf(q[4]);
  return [q[0], q[1], q[2], newOptions, newAnswerIdx, q[5]];
}
/* 같은 막 안에서 몬스터를 조우할수록(=처치할수록) 몬스터 체력이 점점 늘어난다 */
function scaledMonsterHp(baseHp, isBoss){
  const kills = (G.progress[G.act] && G.progress[G.act].kills) || 0;
  const growth = isBoss ? Math.min(kills*0.05, 0.4) : Math.min(kills*0.12, 0.7);
  return Math.round(baseHp * (1+growth));
}
/* 처치할수록(=단계가 올라갈수록) 몬스터 공격력도 서서히 증가한다 */
function scaledMonsterAtk(baseAtk, isBoss){
  const kills = (G.progress[G.act] && G.progress[G.act].kills) || 0;
  const growth = isBoss ? Math.min(kills*0.04, 0.3) : Math.min(kills*0.08, 0.5);
  return Math.max(1, Math.round(baseAtk * (1+growth)));
}
function startBattle(monster, onWin){
  monster.boss ? SND.playBoss() : SND.playBattle(G.act);
  const scaledHp = scaledMonsterHp(monster.hp, !!monster.boss);
  const scaledAtk = scaledMonsterAtk(monster.atk, !!monster.boss);
  G.battle = {
    monster:{...monster, hp:scaledHp, maxHp:scaledHp, atk:scaledAtk},
    onWin,
    combo:0,
    chargesUsed:{hint:false, eliminate:false, negate_wrong:false},
    eliminatedIdx:[],
    timer:null, timeLeft:0, answered:false,
    q:null
  };
  G.screen='battle';
  nextQuestion();
}
function nextQuestion(){
  const b=G.battle;
  b.q = pickQuestion(b.monster.topics, G.act);
  b.eliminatedIdx=[];
  b.answered=false;
  b.timeLeft = currentTimer();
  renderBattle();
  startTimer();
}
function startTimer(){
  clearInterval(G.battle.timer);
  const total=currentTimer();
  let lastSec=Math.ceil(G.battle.timeLeft);
  G.battle.timer=setInterval(()=>{
    G.battle.timeLeft -= 0.1;
    updateTimerUI(total);
    const pct=(G.battle.timeLeft/total)*100;
    const sec=Math.ceil(G.battle.timeLeft);
    if(pct<30 && sec<lastSec && sec>=0){ SND.sfxTick(); }
    lastSec=sec;
    if(G.battle.timeLeft<=0){
      clearInterval(G.battle.timer);
      if(!G.battle.answered) handleAnswer(-1);
    }
  },100);
}
function updateTimerUI(total){
  const fill=document.getElementById('timerFill');
  if(!fill) return;
  const pct=Math.max(0,(G.battle.timeLeft/total)*100);
  fill.style.width=pct+'%';
  fill.classList.toggle('warn', pct<30);
}

function handleAnswer(idx){
  const b=G.battle; if(b.answered) return; b.answered=true;
  clearInterval(b.timer);
  const q=b.q; const correct = idx===q[4];
  correct ? SND.sfxCorrect() : SND.sfxWrong();
  document.querySelectorAll('.opt-btn').forEach(btn=>btn.disabled=true);
  const btns=document.querySelectorAll('.opt-btn');
  btns[q[4]].classList.add('correct');
  if(!correct && idx>=0) btns[idx].classList.add('wrong');
  const explainBox=document.getElementById('explainBox');
  if(q[5]){ explainBox.textContent='💡 '+q[5]; explainBox.classList.add('show'); }
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('hintBtn').disabled=true;
  document.getElementById('elimBtn').disabled=true;

  if(correct){
    b.combo++;
    const mult = b.combo>=5?2.0:b.combo>=3?1.5:1.0;
    let dmg = currentAtk()*mult;
    let crit=false;
    const critChance = Math.min(0.9, itemSum('crit'));
    if(critChance>0 && Math.random()<critChance){ dmg*=2; crit=true; }
    if(b.combo>=3){ dmg*= (1+itemSum('combo_bonus')); } // 성과 그래프 여러 개면 배율도 누적
    dmg=Math.round(dmg);
    b.monster.hp=Math.max(0,b.monster.hp-dmg);
    animateAttack(dmg, crit);
    updateComboUI(b.combo);
    updateMonsterHp();
    setTimeout(()=>{
      if(b.monster.hp<=0){ onMonsterDefeated(); }
    }, 550);
  } else {
    b.combo=0;
    updateComboUI(0);
    let negated=false;
    if(hasItem('negate_wrong') && !b.chargesUsed.negate_wrong){
      b.chargesUsed.negate_wrong=true; negated=true;
      toast('📜 근로계약서 발동! 피해 무효화');
    }
    if(hasItem('combo_shield') && b.combo>=itemVal('combo_shield',5)) negated=true;
    if(!negated){
      let dmg=b.monster.atk;
      G.items.filter(i=>i.type==='dmg_reduction').forEach(i=>{ dmg*= (1-i.val); }); // 방어 아이템 중첩 시 감소율 복합 적용
      if(b.monster.boss){
        G.items.filter(i=>i.type==='boss_dmg_reduction').forEach(i=>{ dmg*= (1-i.val); });

      dmg=Math.max(1,Math.round(dmg));
      G.player.hp=Math.max(0, G.player.hp-dmg);
      updatePlayerHud();
      animateHit(dmg);

    }

    if(G.player.hp<=0){ handleDefeatCheck(); return; }
    if(b.monster.hp<=0) return; // 이미 onMonsterDefeated에서 처리
    nextQuestion();
  };
}

  const wrap=document.createElement('div');
  wrap.style.position='absolute';
  wrap.style.left=(eRect.left + eRect.width/2 - aRect.left)+'px';
  wrap.style.top=(eRect.top - aRect.top - 14)+'px';
  wrap.style.transform='translateX(-50%)';

  spawnDmgPop((crit?'CRIT! ':'')+'(-'+dmg+')', frame);
  const cv=document.getElementById('sosoCanvas');
  if(cv){ cv.classList.add('soso-pose-attack'); setTimeout(()=>cv.classList.remove('soso-pose-attack'),400); }
}
function animateHit(dmg, negated){
  if(!negated) SND.sfxImpactHeavy();
  const cv=document.getElementById('sosoCanvas');
  if(cv){
    cv.classList.add('soso-pose-hit');
    setTimeout(()=>cv.classList.remove('soso-pose-hit'),400);
    if(!negated) spawnHitFlash(cv);
  }
  spawnDmgPop(negated?'BLOCK!':'(-'+dmg+')', cv, negated?'miss':'');
}
function onMonsterDefeated(){
  SND.sfxVictory();
  const b=G.battle;
  G.progress[G.act].kills = (G.progress[G.act].kills||0)+1;
  const frame=document.getElementById('monsterFrame');
  if(frame) frame.classList.add('dying');
  const cv=document.getElementById('sosoCanvas');
  if(cv) cv.classList.add('soso-pose-victory');
  if(hasItem('heal_on_win')){
    G.player.hp=Math.min(G.player.maxHp, G.player.hp+itemSum('heal_on_win'));
    updatePlayerHud();
  }
  setTimeout(()=>{
    showPanel({
      title:`🎉 ${b.monster.name} 처치!`,
      desc:'승리했습니다.',
      buttons:[{label:'계속', cls:'panel-btn', onClick:()=>{ closePanel(); const cb=b.onWin; G.battle=null; cb(); }}]
    });
  },700);
}
function handleDefeatCheck(){
  if(!G.revived && hasItem('revive')){
    G.revived=true;
    const rIdx = G.items.findIndex(i=>i.type==='revive');
    if(rIdx>=0) G.items.splice(rIdx,1);
    G.player.hp = Math.round(G.player.maxHp*0.5);
    toast('🔄 재입사 제안서 발동! 부활했습니다');
    nextQuestion();
    return;
  }
  clearInterval(G.battle.timer);
  SND.sfxDefeat();
  const gbtns = [
    {label:'처음부터', cls:'panel-btn danger', onClick:()=>{ closePanel(); newGame(); renderTitle(); }},
    {label:'📮 행사 소식 받기', cls:'panel-btn secondary', onClick:()=>{
      closePanel();
      openLeadForm({
        title:'📮 다음엔 오프라인에서',
        lead:'HR 실무자 네트워킹 행사와 세미나 소식을<br>가장 먼저 받아보세요.',
        cta:'신청하기',
        source:'game_over',
        onDone: ()=>{ newGame(); renderTitle(); }
      });
    }}
  ];
  showPanel({
    title:'💀 소소, 쓰러지다',
    desc:'HR 괴물들에게 패배했습니다.<br>다시 도전해볼까요?',
    buttons:gbtns
  });
}

/* =========================================================
   오버레이 패널
   ========================================================= */
function showPanel({title, desc, buttons=[], custom='', onCustomClick}){
  let ov=document.getElementById('overlayPanel');
  if(ov) ov.remove();
  ov=document.createElement('div');
  ov.className='overlay'; ov.id='overlayPanel';
  ov.innerHTML=`<div class="panel">
    <h2>${title}</h2>
    <div class="desc">${desc||''}</div>
    ${custom}
    <div>${buttons.map((b,i)=>`<button class="${b.cls}" data-bi="${i}">${b.label}</button>`).join('')}</div>
  </div>`;
  document.body.appendChild(ov);
  buttons.forEach((b,i)=>{ ov.querySelector(`[data-bi="${i}"]`).onclick=b.onClick; });
  if(onCustomClick){
    ov.querySelectorAll('.reward-card').forEach(card=>{
      card.onclick=()=>onCustomClick(parseInt(card.dataset.idx));
    });
  }
}
function closePanel(){ const ov=document.getElementById('overlayPanel'); if(ov) ov.remove(); }
