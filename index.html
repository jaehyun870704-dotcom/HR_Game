<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>소소의 모험</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

:root{
  --forest-deep:#16311F;
  --forest-mid:#2F5B36;
  --forest-dark:#0F2417;
  --path-tan:#D9C08C;
  --path-tan-dark:#B79A5E;
  --parchment:#EFE1BC;
  --parchment-dark:#DDC896;
  --ink:#2B1B12;
  --mustard:#E8A93C;
  --mustard-dark:#C98A28;
  --ember:#B23A24;
  --ember-dark:#8A2A19;
  --moss:#8FBF5C;
  --moss-dark:#5B8C3A;
  --gold:#F0C766;
  --purple:#8B5FBF;
  --blue:#5C8FBF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--forest-dark);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
.pixel{font-family:'Press Start 2P',monospace;}
#app{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
}
button{
  font-family:'Noto Sans KR',sans-serif;
  cursor:pointer;
  border:none;
  outline:none;
}
button:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--mustard-dark); border-radius:4px;}

/* ---------- 공통 ---------- */
.screen{width:100%; max-width:520px; min-height:100vh; position:relative; margin:0 auto;}
.hidden{display:none !important;}
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--gold); padding:10px 18px; border-radius:8px;
  font-size:13px; font-weight:700; z-index:999; box-shadow:0 4px 12px rgba(0,0,0,.4);
  border:2px solid var(--gold); opacity:0; transition:opacity .25s, top .25s;
  pointer-events:none; text-align:center; max-width:88%;
}
.toast.show{opacity:1; top:24px;}
.sound-toggle{
  position:fixed; top:12px; right:12px; z-index:998;
  width:38px; height:38px; border-radius:50%; border:2px solid var(--ink);
  background:var(--parchment-dark); font-size:16px; line-height:1; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;
}
.sound-toggle.muted{ opacity:.55; }

/* ---------- 타이틀 ---------- */
.title-screen{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 50% 20%, #1f4a2c 0%, var(--forest-deep) 55%, var(--forest-dark) 100%);
  padding:24px; text-align:center; gap:6px;
}
.title-badge{
  font-size:11px; letter-spacing:2px; color:var(--gold); opacity:.85; margin-bottom:10px;
}
.title-main{
  font-size:32px; color:var(--mustard); text-shadow:3px 3px 0 var(--ink), 0 0 24px rgba(232,169,60,.35);
  line-height:1.5; margin:0 0 18px;
}
.title-sub{ color:var(--path-tan); font-size:13px; margin-bottom:34px; line-height:1.8; opacity:.9;}
.soso-title-wrap{ margin-bottom:28px; filter:drop-shadow(0 8px 16px rgba(0,0,0,.5)); }
.btn-primary{
  background:linear-gradient(180deg,var(--mustard),var(--mustard-dark));
  color:var(--ink); font-weight:900; font-size:16px; padding:16px 42px; border-radius:10px;
  border-bottom:4px solid #9a6a1c; box-shadow:0 4px 0 rgba(0,0,0,.25);
  transition:transform .08s;
}
.btn-primary:active{ transform:translateY(3px); border-bottom-width:1px;}
.btn-secondary{
  margin-top:14px; background:transparent; color:var(--path-tan); font-size:12px;
  text-decoration:underline; padding:8px;
}
.topic-list{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:380px; margin-top:22px;}
.topic-chip{
  font-size:10px; background:rgba(217,192,140,.12); border:1px solid var(--path-tan-dark);
  color:var(--path-tan); padding:5px 9px; border-radius:20px;
}

/* ---------- 지도 화면 ---------- */
.map-screen{ min-height:100vh; background:
    linear-gradient(180deg, var(--forest-dark) 0%, var(--forest-deep) 8%, var(--forest-mid) 100%);
  padding-bottom:40px; position:relative;
}
.map-header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; background:linear-gradient(180deg,rgba(15,36,23,.97),rgba(15,36,23,.75) 80%,transparent);
}
.act-label{ font-size:11px; color:var(--gold); }
.act-title{ font-size:15px; color:var(--parchment); font-weight:900; margin-top:2px;}
.hp-pill{
  display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.35); border:1px solid var(--ember);
  border-radius:20px; padding:6px 12px;
}
.hp-pill .heart{color:var(--ember); font-size:14px;}
.hp-pill .val{font-size:12px; font-weight:900; color:var(--parchment);}
.map-scroll{ position:relative; padding:20px 12px 10px; }
.map-svg{ position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1;}
.map-row{ display:flex; justify-content:center; gap:34px; margin-bottom:64px; position:relative; z-index:2; }
.node-btn{
  width:64px; height:64px; border-radius:14px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; position:relative; transition:transform .15s, filter .15s;
  background:var(--path-tan); border:3px solid var(--path-tan-dark);
  box-shadow:0 4px 0 rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.15);
}
.node-btn .ic{font-size:24px;}
.node-btn .lv{font-size:8px; color:var(--ink); opacity:.6; margin-top:1px;}
.node-btn.locked{ filter:grayscale(.9) brightness(.45); cursor:default; }
.node-btn.reachable{ cursor:pointer; animation:pulseNode 1.8s ease-in-out infinite; }
.node-btn.reachable:hover{ transform:translateY(-4px) scale(1.05); }
.node-btn.done{ filter:brightness(.6) saturate(.5); cursor:default; }
.node-btn.boss{ width:78px; height:78px; background:var(--ember); border-color:var(--ember-dark); }
.node-btn.boss .ic{font-size:32px;}
@keyframes pulseNode{ 0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 0 0 rgba(240,199,102,.6);} 50%{box-shadow:0 4px 0 rgba(0,0,0,.25), 0 0 0 10px rgba(240,199,102,0);} }
.player-token{
  position:absolute; width:36px; height:36px; z-index:5; pointer-events:none;
  transition:top .5s ease, left .5s ease; transform:translate(-50%,-115%);
  animation:tokenBob 1.6s ease-in-out infinite;
}
.player-token img{
  width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
  box-shadow:0 0 0 4px rgba(232,169,60,.35), 0 4px 6px rgba(0,0,0,.45);
}
@keyframes tokenBob{ 0%,100%{ margin-top:0; } 50%{ margin-top:-4px; } }
.map-legend{
  display:flex; justify-content:center; gap:10px; flex-wrap:wrap; padding:10px 16px 0; font-size:9px; color:var(--path-tan);
}
.map-legend span{ display:flex; align-items:center; gap:3px; }
.kills-hint{
  text-align:center; font-size:10px; color:var(--gold); background:rgba(0,0,0,.25); margin:8px 16px 0;
  padding:6px 10px; border-radius:8px; border:1px solid rgba(240,199,102,.3);
}
.node-btn.locked .ic{ filter:saturate(.3); }

/* ---------- 인벤토리 바 ---------- */
.inv-bar{
  position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; justify-content:center; gap:8px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom)); background:rgba(15,36,23,.95);
  border-top:2px solid var(--mustard-dark); max-width:520px; margin:0 auto;
}
.inv-slot{
  width:38px; height:38px; border-radius:8px; background:rgba(217,192,140,.1); border:1px dashed var(--path-tan-dark);
  display:flex; align-items:center; justify-content:center; font-size:18px; position:relative;
}
.inv-slot.filled{ background:rgba(232,169,60,.15); border:1px solid var(--mustard);}
.inv-slot .rarity-dot{ position:absolute; top:2px; right:2px; width:6px; height:6px; border-radius:50%;}

/* ---------- 전투 화면 (Game Boy 포켓몬 스타일 레이아웃) ---------- */
.battle-screen{ min-height:100vh; display:flex; flex-direction:column;
  background:
   radial-gradient(ellipse at 50% 0%, #2a4d2f 0%, var(--forest-deep) 60%),
   var(--forest-dark);
  padding-bottom:min(46vh, 232px);
}
.battle-topbar{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; }
.act-chip{ font-size:9px; color:var(--gold); background:rgba(0,0,0,.3); padding:4px 8px; border-radius:6px;}
.combo-chip{ font-size:10px; color:var(--parchment); background:rgba(0,0,0,.3); padding:4px 8px; border-radius:6px; display:flex; align-items:center; gap:4px;}
.combo-chip b{color:var(--gold); font-size:12px;}

/* 전투 무대: 4분면 절대배치 (좌상 적정보 / 우상 적스프라이트 / 좌하 소소스프라이트 / 우하 소소정보) */
.arena{
  position:relative; width:100%; max-width:480px; margin:0 auto;
  aspect-ratio:16/12; min-height:220px; max-height:46vh;
  padding:0; overflow:hidden;
}
.arena::after{ content:''; position:absolute; left:6%; right:6%; bottom:6%; height:14px; background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent 70%);}

/* 정보창(적/플레이어 공통) — GB식 흰 박스 + 굵은 테두리 */
.enemy-infobox, .player-infobox{
  position:absolute; z-index:6; background:var(--parchment); border:3px solid var(--ink); border-radius:8px;
  padding:6px 9px 7px; box-shadow:0 3px 0 rgba(0,0,0,.28); max-width:60%; min-width:118px;
}
.enemy-infobox{ top:3%; left:3%; }
.player-infobox{ bottom:22%; right:3%; text-align:right; }
.ib-toprow{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px;}
.player-infobox .ib-toprow{ flex-direction:row-reverse; }
.ib-name{ font-size:11.5px; font-weight:900; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ib-lv{ font-size:9px; color:#6b5a3e; font-weight:800; flex-shrink:0;}
.ib-hp-row{ display:flex; align-items:center; gap:5px; }
.player-infobox .ib-hp-row{ flex-direction:row-reverse; }
.ib-hp-label{ font-size:7.5px; color:var(--ink); flex-shrink:0; }
.ib-hp-num{ font-size:9.5px; color:var(--ink); text-align:right; margin-top:3px; font-weight:800;}

.monster-hpbar, .player-hpbar{
  width:100px; height:11px; background:#1b1210; border:2px solid var(--ink); border-radius:5px; overflow:hidden;
  position:relative; box-shadow:inset 0 2px 3px rgba(0,0,0,.6); flex:1;
}
.monster-hpbar-fill{ height:100%; background:linear-gradient(180deg,#8fe15a,var(--moss-dark)); transition:width .4s ease, background .3s; }
.player-hpbar-fill{ height:100%; background:linear-gradient(180deg,#8fe15a,var(--moss-dark)); transition:width .4s ease, background .3s; }
.player-infobox.low-hp .player-hpbar-fill{ background:linear-gradient(180deg,#ff8a6a,var(--ember)); }
.player-infobox.low-hp .ib-hp-num{ color:var(--ember-dark); animation:lowHpBlink 1s ease-in-out infinite; }
.player-infobox.low-hp{ animation:lowHpBorder 1s ease-in-out infinite; }
@keyframes lowHpBlink{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
@keyframes lowHpBorder{ 0%,100%{ box-shadow:0 3px 0 rgba(0,0,0,.28);} 50%{ box-shadow:0 3px 0 rgba(0,0,0,.28), 0 0 0 4px rgba(178,58,36,.55);} }

.soso-slot{ position:absolute; left:2%; bottom:2%; z-index:5; }
.monster-slot{ position:absolute; right:4%; top:16%; z-index:4; display:flex; flex-direction:column; align-items:center; }
.monster-frame{
  width:clamp(84px,24vw,116px); height:clamp(84px,24vw,116px); border-radius:16px;
  background:linear-gradient(180deg,var(--parchment-dark),var(--path-tan));
  border:3px solid var(--ink); display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 0 rgba(0,0,0,.3); position:relative; transition:transform .12s;
}
#monsterCanvas{ width:88%; height:88%; filter:drop-shadow(0 3px 3px rgba(0,0,0,.35)); image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; }
.monster-frame.shake{ animation:shakeM .3s; }
.monster-frame.dying{ animation:dying .5s forwards; }
@keyframes shakeM{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px) rotate(-3deg);} 75%{transform:translateX(8px) rotate(3deg);} }
@keyframes dying{ to{ transform:scale(0) rotate(30deg); opacity:0;} }
.dmg-pop{
  position:absolute; font-size:18px; color:#e03131; text-shadow:2px 2px 0 var(--ink); pointer-events:none;
  animation:popUp .8s ease forwards; z-index:10; font-family:'Press Start 2P',monospace;
}
.dmg-pop.miss{ color:#aaa; }
@keyframes popUp{ 0%{opacity:0; transform:translateY(0) scale(.6);} 15%{opacity:1; transform:translateY(-10px) scale(1.1);} 100%{opacity:0; transform:translateY(-52px) scale(1);} }
.hit-flash{ position:absolute; inset:0; border-radius:50%; background:rgba(217,42,42,.45); pointer-events:none; z-index:6; animation:hitFlashFade .35s ease forwards; }
@keyframes hitFlashFade{ 0%{opacity:1;} 100%{opacity:0;} }

#sosoCanvas{
  width:clamp(96px,28vw,132px); height:clamp(96px,28vw,132px); border-radius:50%; object-fit:cover; display:block;
  border:3px solid var(--mustard-dark); box-shadow:0 6px 6px rgba(0,0,0,.4), 0 0 0 4px rgba(232,169,60,.25);
  transition:transform .15s ease, filter .15s ease;
}
#sosoCanvas.soso-pose-attack{ transform:translateX(10px) scale(1.06); filter:brightness(1.15) drop-shadow(0 6px 6px rgba(0,0,0,.4)); }
#sosoCanvas.soso-pose-hit{ animation:sosoHitShake .35s ease; filter:brightness(1.3) saturate(1.3) drop-shadow(0 6px 6px rgba(0,0,0,.4)); }
#sosoCanvas.soso-pose-victory{ animation:sosoVictoryBounce .6s ease; }
@keyframes sosoHitShake{
  0%{transform:translateX(0) scale(1,1) rotate(0);}
  15%{transform:translateX(-8px) scale(.92,1.08) rotate(-6deg);}
  40%{transform:translateX(7px) scale(1.05,.93) rotate(5deg);}
  65%{transform:translateX(-4px) scale(.97,1.03) rotate(-2deg);}
  100%{transform:translateX(0) scale(1,1) rotate(0);}
}
@keyframes sosoVictoryBounce{ 0%{transform:translateY(0) scale(1);} 30%{transform:translateY(-14px) scale(1.08);} 60%{transform:translateY(0) scale(1);} 80%{transform:translateY(-6px);} 100%{transform:translateY(0);} }
@media (max-width:360px){
  .enemy-infobox, .player-infobox{ padding:5px 7px 6px; min-width:104px; }
  .ib-name{ font-size:10.5px; }
  .monster-hpbar, .player-hpbar{ width:80px; height:10px; }
}

/* ---------- 하단 문제 패널 ---------- */
.quiz-dock{
  position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; z-index:40;
  background:var(--parchment); border-top:4px solid var(--ink); border-radius:18px 18px 0 0;
  box-shadow:0 -8px 24px rgba(0,0,0,.4); padding:12px 14px calc(12px + env(safe-area-inset-bottom));
}
.timer-track{ height:8px; background:#c8b384; border-radius:4px; overflow:hidden; margin-bottom:10px; border:1px solid var(--ink);}
.timer-fill{ height:100%; background:var(--moss-dark); transition:width .12s linear, background .3s; }
.timer-fill.warn{ background:var(--ember); }
.quiz-topic{ font-size:10px; color:var(--mustard-dark); font-weight:700; margin-bottom:3px;}
.quiz-q{ font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.5; margin-bottom:10px; min-height:44px;}
.quiz-options{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;}
.opt-btn{
  background:#fff9ec; border:2px solid var(--parchment-dark); border-radius:10px; padding:10px 8px;
  font-size:12.5px; font-weight:600; text-align:left; line-height:1.35; color:var(--ink); transition:all .15s;
  display:flex; gap:6px;
}
.opt-btn .num{ color:var(--mustard-dark); font-weight:900; flex-shrink:0;}
.opt-btn:not(:disabled):active{ transform:scale(.97); }
.opt-btn:disabled{ cursor:default; }
.opt-btn.correct{ background:var(--moss); border-color:var(--moss-dark); color:#0d2b06;}
.opt-btn.wrong{ background:#e8a794; border-color:var(--ember); color:var(--ember-dark);}
.opt-btn.eliminated{ opacity:.25; text-decoration:line-through; }
.explain-box{
  font-size:11.5px; background:rgba(0,0,0,.05); border-radius:8px; padding:8px 10px; color:#5a4a34;
  margin-bottom:8px; line-height:1.5; display:none;
}
.explain-box.show{ display:block; }
.dock-actions{ display:flex; gap:8px; align-items:center; }
.skill-btn{
  font-size:10.5px; background:rgba(139,95,191,.12); border:1.5px solid var(--purple); color:#5b3f80;
  padding:7px 10px; border-radius:8px; font-weight:700; display:flex; align-items:center; gap:4px;
}
.skill-btn:disabled{ opacity:.3; }
.next-btn{
  margin-left:auto; background:var(--ink); color:var(--gold); font-weight:900; font-size:12.5px;
  padding:10px 20px; border-radius:8px;
}

/* ---------- 오버레이(보상/휴식/이벤트/게임오버/승리) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,20,12,.88); z-index:100; display:flex; align-items:center;
  justify-content:center; padding:24px; backdrop-filter:blur(2px);
}
.panel{
  background:var(--parchment); border:4px solid var(--ink); border-radius:16px; padding:26px 22px;
  max-width:440px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.5);
  max-height:88vh; overflow-y:auto;
}
.panel h2{ font-size:18px; margin:0 0 6px; color:var(--ink); }
.panel .desc{ font-size:12.5px; color:#6b5a42; margin-bottom:18px; line-height:1.6;}
.reward-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:14px;}
.reward-card{
  width:120px; background:#fff9ec; border:2px solid var(--parchment-dark); border-radius:12px; padding:12px 8px;
  cursor:pointer; transition:transform .15s, box-shadow .15s;
}
.reward-card:hover{ transform:translateY(-4px); box-shadow:0 6px 14px rgba(0,0,0,.2); }
.reward-card .ric{ font-size:32px; margin-bottom:6px;}
.reward-card .rname{ font-size:11.5px; font-weight:900; margin-bottom:4px;}
.reward-card .rdesc{ font-size:9.5px; color:#7a6a52; line-height:1.4;}
.reward-card .rrarity{ font-size:8px; font-weight:900; margin-top:6px; padding:2px 6px; border-radius:10px; display:inline-block;}
.rrarity.common{ background:#d9d9d9; color:#444;}
.rrarity.rare{ background:#cfe0f5; color:#2a5788;}
.rrarity.legendary{ background:#f0d9a6; color:#8a5a0a;}
.panel-btn{
  background:var(--mustard); color:var(--ink); font-weight:900; font-size:13px; padding:11px 24px;
  border-radius:8px; border-bottom:3px solid var(--mustard-dark); margin:4px;
}
.panel-btn.secondary{ background:transparent; border:2px solid var(--path-tan-dark); color:var(--ink); border-bottom:none;}
.panel-btn.danger{ background:var(--ember); color:#fff; border-bottom-color:var(--ember-dark);}

/* ---------- 네트워킹 신청(DB 수집) 폼 ---------- */
.btn-lead{
  display:block; margin:16px auto 0; background:linear-gradient(180deg,var(--blue),#3f6f9c);
  color:#fff; font-weight:900; font-size:17px; padding:19px 44px; border-radius:14px;
  border-bottom:5px solid #2d5175; box-shadow:0 5px 0 rgba(0,0,0,.25);
  transition:transform .08s; letter-spacing:.3px;
}
.btn-lead:active{ transform:translateY(3px); border-bottom-width:1px; }
.lead-panel{ text-align:left; }
.lead-title{ text-align:center; font-size:17px; font-weight:900; color:var(--ink); margin:0 0 6px; }
.lead-lead{ text-align:center; font-size:11.5px; color:#6b5a42; line-height:1.65; margin-bottom:16px; }
.lead-field{ margin-bottom:10px; }
.lead-field label{ display:block; font-size:11.5px; font-weight:900; color:var(--ink); margin-bottom:5px; }
.lead-field .req{ color:var(--ember); margin-left:2px; }
.lead-field input{
  width:100%; padding:11px 12px; font-size:14px; font-family:'Noto Sans KR',sans-serif; color:var(--ink);
  background:#fff9ec; border:2px solid var(--parchment-dark); border-radius:8px; outline:none;
  transition:border-color .15s, background .15s;
}
.lead-field input::placeholder{ color:#b6a684; }
.lead-field input:focus{ border-color:var(--mustard-dark); background:#fff; }
.lead-field input.err{ border-color:var(--ember); background:#fbe9e5; }
.lead-msg{ font-size:10.5px; font-weight:700; color:var(--ember); margin-top:4px; display:none; }
.lead-msg.show{ display:block; }
.hp-trap{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }

.consent-box{ border:2px solid var(--parchment-dark); border-radius:10px; background:#fff9ec; padding:11px 12px; margin:14px 0 4px; }
.consent-row{ display:flex; align-items:flex-start; gap:8px; font-size:11.5px; line-height:1.55; color:var(--ink); }
.consent-row + .consent-row{ margin-top:9px; }
.consent-row input[type="checkbox"]{ width:18px; height:18px; margin:1px 0 0; accent-color:var(--moss-dark); flex-shrink:0; cursor:pointer; }
.consent-row label{ flex:1; cursor:pointer; }
.consent-all{ font-weight:900; border-bottom:1px dashed var(--parchment-dark); padding-bottom:10px; margin-bottom:2px; }
.tag-req{ color:var(--ember); font-weight:900; }
.tag-opt{ color:#8a7758; font-weight:900; }
.detail-toggle{ display:inline-block; background:none; padding:0; margin-left:2px; font-size:10.5px; color:#8a7758; text-decoration:underline; font-family:inherit; }
.detail-body{ display:none; margin-top:7px; padding:10px 11px; background:#f2e5c6; border-radius:8px; font-size:10.5px; line-height:1.7; color:#5f5039; white-space:pre-line; max-height:180px; overflow-y:auto; }
.detail-body.show{ display:block; }
.lead-note{ font-size:10px; color:#8a7758; text-align:center; line-height:1.6; margin-top:10px; }
.lead-btns{ text-align:center; margin-top:14px; }
.panel-btn[disabled]{ opacity:.55; cursor:default; }
</style>

const _mCache = {};
function _mBlock(g,x,y,w,h,skin,shadow){
  if(w<=0||h<=0) return;
  g.fillStyle=shadow; g.fillRect(x,y,w,h);
  if(w>2 && h>2) { g.fillStyle=skin; g.fillRect(x+1,y+1,w-2,h-2); }
}
function _mStair(g,x0,y0,rows,w0,dw,dir,skin,shadow){
  // 계단식으로 폭이 변하는 픽셀 삼각형 (귀/날개/꼬리용)
  for(let i=0;i<rows;i++){
    const w=Math.max(1,Math.round(w0+dw*i));
    const x = dir<0 ? x0-w : x0;
    _mBlock(g,x,y0+i,w,1,skin,shadow);
  }
}

function pickRewardItems(n){
  const weighted=[];
  ITEMS.forEach(it=>{
    const w = it.rarity==='common'?60: it.rarity==='rare'?32:8;
    weighted.push({it,w});
  });
  const pool=[...ITEMS];
  const out=[];
  while(out.length<n && pool.length){
    let total=0; const cand=pool.map(it=>{const w=it.rarity==='common'?60:it.rarity==='rare'?32:8; total+=w; return {it,w};});
    let r=Math.random()*total, chosen=cand[0].it;
    for(const c of cand){ if(r<c.w){chosen=c.it;break;} r-=c.w; }
    out.push(chosen);
    pool.splice(pool.indexOf(chosen),1);
  }
  return out;
}

/* =========================================================
   사운드 — 외부 음원 파일 없이 Web Audio API로 직접 합성.
   인트로(탐험) 테마는 잔잔한 장조, 전투 테마는 빠른 단조로
   게임 톤에 맞춰 절차적으로 생성한다.
   ========================================================= */
const SND = (function(){
  let ctx=null, master=null, muted=false, currentBgm=null, bgmTimer=null, curAct=1;
  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.34;
      master.connect(ctx.destination);
    }
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(freq, start, dur, type='square', gain=0.16, opt={}){
    if(!ctx) return;
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq, ctx.currentTime+start);
    if(opt.detune) osc.detune.setValueAtTime(opt.detune, ctx.currentTime+start);
    const attack = opt.attack!=null ? opt.attack : 0.01;
    g.gain.setValueAtTime(0, ctx.currentTime+start);
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime+start+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
    let last=g;
    if(opt.lowpass){
      const f=ctx.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(opt.lowpass, ctx.currentTime+start);
      if(opt.sweepTo) f.frequency.linearRampToValueAtTime(opt.sweepTo, ctx.currentTime+start+dur);
      f.Q.value = opt.q||0.8;
      last.connect(f); last=f;
    }
    osc.connect(g); last.connect(master);
    osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.02);
  }
  /* 살짝 디튠된 오실레이터 3개를 겹쳐 현악/합창처럼 두툼하게 만드는 코드 톤 (보스전용) */
  function chordTone(freq, start, dur, gain=0.09, lowpass=null){
    [-6,0,6].forEach(det=>tone(freq,start,dur,'sawtooth',gain/3,{detune:det, attack:0.12, lowpass, q:0.6}));
  }
  function noiseBurst(start, dur, gain=0.14, lowpass=null){
    if(!ctx) return;
    const n=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=ctx.createGain();
    g.gain.setValueAtTime(gain, ctx.currentTime+start);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
    let last=g;
    if(lowpass){ const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lowpass; last.connect(f); last=f; }
    src.connect(g); last.connect(master);
    src.start(ctx.currentTime+start);
  }
  /* ---- 효과음 (기존 유지) ---- */
  function sfxSelect(){ if(muted||!ensureCtx()) return; tone(520,0,0.06,'square',0.10); tone(760,0.05,0.07,'square',0.09); }
  function sfxCorrect(){ if(muted||!ensureCtx()) return; tone(660,0,0.09,'triangle',0.17); tone(880,0.08,0.12,'triangle',0.17); tone(1100,0.16,0.16,'triangle',0.15); }
  function sfxWrong(){ if(muted||!ensureCtx()) return; tone(220,0,0.16,'sawtooth',0.15); tone(160,0.1,0.22,'sawtooth',0.13); }
  function sfxTick(){ if(muted||!ensureCtx()) return; tone(1300,0,0.03,'square',0.05); }
  function sfxVictory(){ if(muted||!ensureCtx()) return; [523,659,784,1047].forEach((f,i)=>tone(f,i*0.11,0.16,'triangle',0.15)); }
  function sfxDefeat(){ if(muted||!ensureCtx()) return; [392,330,262,196].forEach((f,i)=>tone(f,i*0.16,0.22,'sawtooth',0.13)); }
  function sfxImpactLight(){ if(muted||!ensureCtx()) return; noiseBurst(0,0.06,0.12); tone(300,0,0.06,'square',0.08); }
  function sfxImpactHeavy(){ if(muted||!ensureCtx()) return; noiseBurst(0,0.1,0.18); tone(120,0,0.12,'square',0.12); }
  /* ---- 배경음: 탐험(로파이) ---- */
  // 재즈풍 2-5-1 코드(더 낮은 옥타브)를 저역통과 필터로 뭉근하게, 스윙감 있는 리듬
  const lofiChords=[
    {notes:[220,261.6,329.6,392], len:2},   // Am7
    {notes:[196,246.9,293.7,349.2], len:2}, // Dm7
    {notes:[164.8,207.7,246.9,311.1], len:2}, // G7
    {notes:[174.6,220,261.6,329.6], len:2}  // Cmaj7
  ];
  function scheduleIntro(){
    if(muted||currentBgm!=='intro'||!ensureCtx()) return;
    const beat=0.5; let t=0;
    lofiChords.forEach(ch=>{
      ch.notes.forEach((f,i)=>tone(f, t+i*0.03, beat*ch.len*0.95, 'triangle', 0.045, {attack:0.25, lowpass:900}));
      t += beat*ch.len;
    });
    // 은은한 로파이 크래클(비닐 노이즈) 랜덤 팝
    for(let i=0;i<10;i++){
      if(Math.random()<0.6) noiseBurst(Math.random()*t, 0.02, 0.02, 3500);
    }
    bgmTimer=setTimeout(scheduleIntro, t*1000);
  }
  /* ---- 배경음: 전투 (저음 압박감, ACT에 따라 강도↑) ---- */
  function scheduleBattle(){
    if(muted||currentBgm!=='battle'||!ensureCtx()) return;
    const act=curAct;
    const beat = 0.5 - (act-1)*0.06;           // ACT 오를수록 펄스가 빨라짐
    const bassGain = 0.1 + (act-1)*0.035;      // ACT 오를수록 저음이 두꺼워짐
    const bassFreq = 55 - (act-1)*4;           // 살짝 더 낮고 무겁게
    let t=0;
    const pulses=8;
    for(let i=0;i<pulses;i++){
      // 심장박동처럼 낮은 드론 + 타격감 있는 펄스
      tone(bassFreq, t, beat*0.9, 'sine', bassGain, {attack:0.02});
      tone(bassFreq*1.5, t, beat*0.5, 'triangle', bassGain*0.5, {attack:0.02});
      noiseBurst(t, 0.04, 0.06+ (act-1)*0.02, 800);
      if(i%2===1) noiseBurst(t+beat*0.5, 0.03, 0.035, 5000); // 하이햇 느낌의 째깍임
      t += beat;
    }
    bgmTimer=setTimeout(scheduleBattle, t*1000);
  }
  /* ---- 배경음: 보스전 (웅장하게) ---- */
  const bossProg=[164.8, 196, 220, 174.6]; // Gm - low - Am - low, 장중한 진행
  function scheduleBoss(){
    if(muted||currentBgm!=='boss'||!ensureCtx()) return;
    const beat=0.85; let t=0;
    bossProg.forEach((f,i)=>{
      chordTone(f, t, beat*1.9, 0.16, 1400);           // 디튠 3중 합창 코드 (현악 느낌)
      tone(f/2, t, beat*1.9, 'sine', 0.14, {attack:0.05}); // 묵직한 저음 베이스
      if(i%2===0) tone(f*2, t+beat*0.15, 0.22, 'sawtooth', 0.06, {attack:0.01, lowpass:2200, sweepTo:600}); // 브라스풍 스탭
      noiseBurst(t, 0.08, 0.09, 700); // 팀파니 느낌의 저역 타격
      t += beat*2;
    });
    bgmTimer=setTimeout(scheduleBoss, t*1000);
  }
  function stopBgmTimer(){ if(bgmTimer){ clearTimeout(bgmTimer); bgmTimer=null; } }
  function playIntro(){ if(!ensureCtx()||currentBgm==='intro') return; stopBgmTimer(); currentBgm='intro'; scheduleIntro(); }
  function playBattle(act){ curAct=act||1; if(!ensureCtx()||currentBgm==='battle'){ curAct=act||curAct; return; } stopBgmTimer(); currentBgm='battle'; scheduleBattle(); }
  function playBoss(){ if(!ensureCtx()||currentBgm==='boss') return; stopBgmTimer(); currentBgm='boss'; scheduleBoss(); }
  function setMuted(v){
    muted=v;
    if(muted){ stopBgmTimer(); }
    else if(currentBgm==='intro'){ scheduleIntro(); }
    else if(currentBgm==='battle'){ scheduleBattle(); }
    else if(currentBgm==='boss'){ scheduleBoss(); }
  }
  function isMuted(){ return muted; }
  return { ensureCtx, playIntro, playBattle, playBoss, setMuted, isMuted,
    sfxSelect, sfxCorrect, sfxWrong, sfxTick, sfxVictory, sfxDefeat, sfxImpactLight, sfxImpactHeavy };
})();

/* =========================================================
   맵 생성
   ========================================================= */
function generateMap(act){
  const levels=[];
  for(let lv=1; lv<=9; lv++){
    const count = lv===1 ? 3 : (2 + (lv%2===0?1:0)); // 2~3개
    let types;
    if(lv===1){
      // 초기 선택지는 무조건 몬스터 조우
      types = Array(count).fill('battle');
    } else {
      // 실제 타입은 해당 단계에 도달했을 때(안개 해제 시) 결정됨
      types = Array(count).fill('fog');
    }
    const nodes = types.map((type,i)=>({id:`a${act}_l${lv}_${i}`, level:lv, idx:i, type, done:false}));
    levels.push(nodes);
  }
  levels.push([{id:`a${act}_boss`, level:10, idx:0, type:'boss', done:false}]);
  // connections: each node in level i connects to 1-2 nodes in level i+1 with close idx
  for(let lv=0; lv<levels.length-1; lv++){
    const cur=levels[lv], next=levels[lv+1];
    const nextIncoming = new Set();
    cur.forEach(n=>{
      const ratio = n.idx/(Math.max(cur.length-1,1));
      const targetIdx = Math.round(ratio*(next.length-1));
      const conns = new Set([targetIdx]);
      if(next.length>1 && Math.random()<0.5){
        conns.add(Math.max(0,Math.min(next.length-1, targetIdx + (Math.random()<0.5?-1:1))));
      }
      n.next = [...conns];
      conns.forEach(c=>nextIncoming.add(c));
    });
    next.forEach((n,i)=>{
      if(!nextIncoming.has(i)){
        // 고아 노드 방지: 가장 가까운 이전 노드에 연결 추가
        let closest=cur[0]; let bd=999;
        cur.forEach(c=>{ const d=Math.abs(c.idx-i); if(d<bd){bd=d; closest=c;} });
        closest.next.push(i);
      }
    });
  }
  return {act, levels, startLevel:0};
}
function weightedType(w){
  const entries=Object.entries(w);
  const total=entries.reduce((s,[,v])=>s+v,0);
  let r=Math.random()*total;
  for(const [k,v] of entries){ if(r<v) return k; r-=v; }
  return entries[0][0];
}
function weightedTypeExcl(exclList){
  const weights={battle:40, unknown:25, treasure:15, rest:20};
  exclList.forEach(k=>delete weights[k]);
  return weightedType(weights);
}
/* 몬스터를 최소 3회 조우하기 전에는 보물(아이템) 노드가 나오지 않도록 단계별 타입을
   실제로 도달했을 때 결정한다(안개 해제). 항상 전투 1개는 보장한다. */
function ensureLevelRevealed(act){
  const map=G.maps[act]; const prog=G.progress[act];
  const rowIdx=prog.level;
  if(rowIdx>=map.levels.length) return;
  const row=map.levels[rowIdx];
  if(!row.some(n=>n.type==='fog')) return;
  const kills = prog.kills||0;
  const allowTreasure = kills>=3;
  const count=row.length;
  let types=['battle'];
  types.push(allowTreasure ? 'treasure' : weightedTypeExcl(['treasure']));
  for(let i=2;i<count;i++){
    types.push(weightedTypeExcl(allowTreasure?[]:['treasure']));
  }
  types=types.sort(()=>Math.random()-0.5);
  row.forEach((n,i)=>{ n.type=types[i]; });
}

/* =========================================================
   막 시작 / 지도
   ========================================================= */
function startAct(act){
  G.act=act;
  if(!G.maps[act]) G.maps[act]=generateMap(act);
  if(!G.progress[act]) G.progress[act]={level:0, visited:[], kills:0};
  if(act===2) G.player.baseAtk += 5;
  if(act===3) G.player.baseAtk += 7;
  G.screen='map';
  renderMap();
}
function reachableLevel(){ return G.progress[G.act].level; }
function renderMap(){
  SND.playIntro();
  const app=document.getElementById('app');
  const map=G.maps[G.act];
  const prog=G.progress[G.act];
  ensureLevelRevealed(G.act);
  const allowedIds = getAllowedIds(map, prog);
  const actNames={1:'신입 사원의 숲',2:'대리·과장의 깊은 숲',3:'팀장·임원의 어둠의 숲'};
  app.innerHTML=`
  <div class="screen map-screen">
    <div class="map-header">
      <div><div class="act-label pixel">ACT ${G.act}</div><div class="act-title">${actNames[G.act]}</div></div>
      <div class="hp-pill"><span class="heart">❤</span><span class="val">${G.player.hp}/${G.player.maxHp}</span></div>
    </div>
    <div class="map-legend">
      <span>💀전투</span><span>❓미지</span><span>📦보물</span><span>☕휴식</span><span>👑보스</span>
    </div>
    <div class="kills-hint">몬스터 처치 ${prog.kills||0}회 ${(prog.kills||0)<3?`· 보물은 ${3-(prog.kills||0)}회 더 처치 후 등장`:'· 보물 등장 중'}</div>
    <div class="map-scroll" id="mapScroll">
      <svg class="map-svg" id="mapSvg"></svg>
      ${map.levels.map((row,lv)=>{
        return `<div class="map-row" data-level="${lv}">
          ${row.map(n=>{
            const isDone = prog.visited.includes(n.id);
            const isReachable = lv===prog.level && !isDone && allowedIds.has(n.id);
            const cls = n.type==='boss'?'boss':'';
            let state = isDone?'done':(isReachable?'reachable':'locked');
            return `<button class="node-btn ${cls} ${state}" data-id="${n.id}" data-level="${lv}" ${state!=='reachable'?'disabled':''}>
              <span class="ic">${NODE_ICON[n.type]}</span>

      }).join('')}

  document.querySelectorAll('.node-btn.reachable').forEach(btn=>{
    btn.onclick=()=>{ SND.sfxSelect(); enterNode(btn.dataset.id, parseInt(btn.dataset.level)); };
  });
  requestAnimationFrame(()=>{ drawMapLines(map, prog, allowedIds); positionPlayerToken(map, prog); });
}
function getAllowedIds(map, prog){
  if(prog.visited.length===0){
    return new Set(map.levels[0].map(n=>n.id));
  }
  const lastId=prog.visited[prog.visited.length-1];
  const lastNode=findNode(lastId);
  const targetRow=map.levels[prog.level];
  if(!lastNode || !targetRow) return new Set();
  return new Set((lastNode.next||[]).map(idx=>targetRow[idx]&&targetRow[idx].id).filter(Boolean));
}
function drawMapLines(map,prog,allowedIds){
  const svg=document.getElementById('mapSvg');
  const scroll=document.getElementById('mapScroll');
  if(!svg||!scroll) return;
  const scRect=scroll.getBoundingClientRect();
  svg.setAttribute('width', scRect.width);
  svg.setAttribute('height', scRect.height);
  let paths='';
  map.levels.forEach((row,lv)=>{
    if(lv===map.levels.length-1) return;
    row.forEach(n=>{
      const fromEl=document.querySelector(`.node-btn[data-id="${n.id}"]`);
      if(!fromEl) return;
      const fr=fromEl.getBoundingClientRect();
      const fx=fr.left+fr.width/2-scRect.left, fy=fr.top+fr.height-scRect.top;
      (n.next||[]).forEach(ni=>{
        const target=map.levels[lv+1][ni];
        if(!target) return;
        const toEl=document.querySelector(`.node-btn[data-id="${target.id}"]`);
        if(!toEl) return;
        const tr=toEl.getBoundingClientRect();
        const tx=tr.left+tr.width/2-scRect.left, ty=tr.top-scRect.top;
        const done = prog.visited.includes(n.id) && prog.visited.includes(target.id);
        const isCurrentChoice = prog.visited.includes(n.id) && allowedIds && allowedIds.has(target.id) && lv+1===prog.level;
        const active = done || isCurrentChoice;
        paths+=`<line x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" stroke="${done?'#F0C766':'#D9C08C'}" stroke-width="2.5" stroke-dasharray="6,6" opacity="${active?0.9:0.22}"/>`;
      });
    });
  });
  svg.innerHTML=paths;
}
function positionPlayerToken(map,prog){
  const scroll=document.getElementById('mapScroll');
  if(!scroll) return;
  const lv=Math.min(prog.level, map.levels.length-1);
  const visitedInLevel = map.levels[lv].find(n=>!prog.visited.includes(n.id)) || map.levels[lv][0];
  let refEl;
  if(prog.level===0 && prog.visited.length===0){
    refEl=document.querySelector(`.map-row[data-level="0"]`);
  } else {
    const lastVisitedId = prog.visited[prog.visited.length-1];
    refEl = lastVisitedId ? document.querySelector(`.node-btn[data-id="${lastVisitedId}"]`) : null;
  }
  let existing=document.querySelector('.player-token');
  if(!existing){
    existing=document.createElement('div');
    existing.className='player-token';
    existing.innerHTML=`<img src="${SOSO_IMG}" alt="소소" width="34" height="34">`;
    scroll.appendChild(existing);
  }
  const scRect=scroll.getBoundingClientRect();
  if(refEl){
    const r=refEl.getBoundingClientRect();
    existing.style.left=(r.left+r.width/2-scRect.left)+'px';
    existing.style.top=(r.top-scRect.top)+'px';
  }
}
function renderInvBar(){
  const slots=[];
  for(let i=0;i<6;i++){
    const it=G.items[i];
    if(it){

function markVisited(nodeId, level){
  const prog=G.progress[G.act];
  prog.visited.push(nodeId);
  prog.level = level+1;
}
function findNode(nodeId){
  const map=G.maps[G.act];
  for(const row of map.levels) for(const n of row) if(n.id===nodeId) return n;
}
function enterNode(nodeId, level){
  const node=findNode(nodeId);
  if(node.type==='battle'){
    const pool=MONSTERS[G.act];
    const m=pool[Math.floor(Math.random()*pool.length)];
    startBattle({...m}, ()=>{ markVisited(nodeId,level); afterNodeResolved(); });
  } else if(node.type==='boss'){
    const b=BOSSES[G.act];
    startBattle({...b}, ()=>{ markVisited(nodeId,level); onBossDefeated(); });
  } else if(node.type==='treasure'){
    markVisited(nodeId,level);
    showTreasure(()=>afterNodeResolved());
  } else if(node.type==='rest'){
    markVisited(nodeId,level);
    showRest(()=>afterNodeResolved());
  } else if(node.type==='unknown'){
    markVisited(nodeId,level);
    resolveUnknown(()=>afterNodeResolved());
  }
}
function afterNodeResolved(){
  G.screen='map'; renderMap();
}

/* =========================================================
   전투
   ========================================================= */
function pickQuestion(topics, act){
  const level = act;
  let pool = QUESTIONS.filter(q=>topics.includes(q[1]) && !G.usedQuestionIds.has(q[0]));
  if(pool.length===0){
    G.usedQuestionIds.clear();
    pool = QUESTIONS.filter(q=>topics.includes(q[1]));
  }
  const q = pool[Math.floor(Math.random()*pool.length)];
  G.usedQuestionIds.add(q[0]);
  return shuffleQuestionOptions(q);
}
/* 정답이 특정 번호(주로 1번)에 몰리지 않도록 매번 보기 순서를 랜덤으로 섞는다.
   원본 QUESTIONS 데이터는 건드리지 않고 새 배열을 반환한다. */
function shuffleQuestionOptions(q){
  const order=[0,1,2,3];
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [order[i],order[j]]=[order[j],order[i]];
  }
  const newOptions = order.map(i=>q[3][i]);
  const newAnswerIdx = order.indexOf(q[4]);
  return [q[0], q[1], q[2], newOptions, newAnswerIdx, q[5]];
}
/* 같은 막 안에서 몬스터를 조우할수록(=처치할수록) 몬스터 체력이 점점 늘어난다 */
function scaledMonsterHp(baseHp, isBoss){
  const kills = (G.progress[G.act] && G.progress[G.act].kills) || 0;
  const growth = isBoss ? Math.min(kills*0.05, 0.4) : Math.min(kills*0.12, 0.7);
  return Math.round(baseHp * (1+growth));
}
/* 처치할수록(=단계가 올라갈수록) 몬스터 공격력도 서서히 증가한다 */
function scaledMonsterAtk(baseAtk, isBoss){
  const kills = (G.progress[G.act] && G.progress[G.act].kills) || 0;
  const growth = isBoss ? Math.min(kills*0.04, 0.3) : Math.min(kills*0.08, 0.5);
  return Math.max(1, Math.round(baseAtk * (1+growth)));
}
function startBattle(monster, onWin){
  monster.boss ? SND.playBoss() : SND.playBattle(G.act);
  const scaledHp = scaledMonsterHp(monster.hp, !!monster.boss);
  const scaledAtk = scaledMonsterAtk(monster.atk, !!monster.boss);
  G.battle = {
    monster:{...monster, hp:scaledHp, maxHp:scaledHp, atk:scaledAtk},
    onWin,
    combo:0,
    chargesUsed:{hint:false, eliminate:false, negate_wrong:false},
    eliminatedIdx:[],
    timer:null, timeLeft:0, answered:false,
    q:null
  };
  G.screen='battle';
  nextQuestion();
}
function nextQuestion(){
  const b=G.battle;
  b.q = pickQuestion(b.monster.topics, G.act);
  b.eliminatedIdx=[];
  b.answered=false;
  b.timeLeft = currentTimer();
  renderBattle();
  startTimer();
}
function startTimer(){
  clearInterval(G.battle.timer);
  const total=currentTimer();
  let lastSec=Math.ceil(G.battle.timeLeft);
  G.battle.timer=setInterval(()=>{
    G.battle.timeLeft -= 0.1;
    updateTimerUI(total);
    const pct=(G.battle.timeLeft/total)*100;
    const sec=Math.ceil(G.battle.timeLeft);
    if(pct<30 && sec<lastSec && sec>=0){ SND.sfxTick(); }
    lastSec=sec;
    if(G.battle.timeLeft<=0){
      clearInterval(G.battle.timer);
      if(!G.battle.answered) handleAnswer(-1);
    }
  },100);
}
function updateTimerUI(total){
  const fill=document.getElementById('timerFill');
  if(!fill) return;
  const pct=Math.max(0,(G.battle.timeLeft/total)*100);
  fill.style.width=pct+'%';
  fill.classList.toggle('warn', pct<30);
}
function renderBattle(){
  const app=document.getElementById('app');
  const b=G.battle; const m=b.monster; const q=b.q;
  const hintUsed=b.chargesUsed.hint, elimUsed=b.chargesUsed.eliminate;
  const hasHint=hasItem('hint'), hasElim=hasItem('eliminate');
  app.innerHTML=`
  <div class="screen battle-screen">
    <div class="battle-topbar">
      <div class="act-chip pixel">ACT ${G.act}</div>
      <div class="combo-chip">콤보 <b id="comboVal">${b.combo}</b>🔥</div>
    </div>

    toRemove.forEach(i=>{
      const el=document.querySelectorAll('.opt-btn')[i];
      el.classList.add('eliminated'); el.disabled=true;
    });
    toast('📊 오답 2개 제거!');
  };
}
function handleAnswer(idx){
  const b=G.battle; if(b.answered) return; b.answered=true;
  clearInterval(b.timer);
  const q=b.q; const correct = idx===q[4];
  correct ? SND.sfxCorrect() : SND.sfxWrong();
  document.querySelectorAll('.opt-btn').forEach(btn=>btn.disabled=true);
  const btns=document.querySelectorAll('.opt-btn');
  btns[q[4]].classList.add('correct');
  if(!correct && idx>=0) btns[idx].classList.add('wrong');
  const explainBox=document.getElementById('explainBox');
  if(q[5]){ explainBox.textContent='💡 '+q[5]; explainBox.classList.add('show'); }
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('hintBtn').disabled=true;
  document.getElementById('elimBtn').disabled=true;

  if(correct){
    b.combo++;
    const mult = b.combo>=5?2.0:b.combo>=3?1.5:1.0;
    let dmg = currentAtk()*mult;
    let crit=false;
    const critChance = Math.min(0.9, itemSum('crit'));
    if(critChance>0 && Math.random()<critChance){ dmg*=2; crit=true; }
    if(b.combo>=3){ dmg*= (1+itemSum('combo_bonus')); } // 성과 그래프 여러 개면 배율도 누적
    dmg=Math.round(dmg);
    b.monster.hp=Math.max(0,b.monster.hp-dmg);
    animateAttack(dmg, crit);
    updateComboUI(b.combo);
    updateMonsterHp();
    setTimeout(()=>{
      if(b.monster.hp<=0){ onMonsterDefeated(); }
    }, 550);
  } else {
    b.combo=0;
    updateComboUI(0);
    let negated=false;
    if(hasItem('negate_wrong') && !b.chargesUsed.negate_wrong){
      b.chargesUsed.negate_wrong=true; negated=true;
      toast('📜 근로계약서 발동! 피해 무효화');
    }
    if(hasItem('combo_shield') && b.combo>=itemVal('combo_shield',5)) negated=true;
    if(!negated){
      let dmg=b.monster.atk;
      G.items.filter(i=>i.type==='dmg_reduction').forEach(i=>{ dmg*= (1-i.val); }); // 방어 아이템 중첩 시 감소율 복합 적용
      if(b.monster.boss){
        G.items.filter(i=>i.type==='boss_dmg_reduction').forEach(i=>{ dmg*= (1-i.val); });
      }
      dmg=Math.max(1,Math.round(dmg));
      G.player.hp=Math.max(0, G.player.hp-dmg);
      updatePlayerHud();
      animateHit(dmg);
    } else {
      animateHit(0,true);
    }
  }
  document.getElementById('nextBtn').onclick=()=>{
    if(G.player.hp<=0){ handleDefeatCheck(); return; }
    if(b.monster.hp<=0) return; // 이미 onMonsterDefeated에서 처리
    nextQuestion();
  };
}
function updateComboUI(v){ const el=document.getElementById('comboVal'); if(el) el.textContent=v; }
function updateMonsterHp(){
  const b=G.battle;
  const fill=document.getElementById('mHpFill'); const txt=document.getElementById('mHpText');
  if(fill) fill.style.width=(Math.max(0,b.monster.hp)/b.monster.maxHp*100)+'%';
  if(txt) txt.textContent=`${Math.max(0,b.monster.hp)}/${b.monster.maxHp}`;
}
function updatePlayerHud(){
  const hud=document.getElementById('playerHud');
  if(!hud) return;
  const fill=document.getElementById('pHpFill'); const txt=document.getElementById('pHpText');
  const pct = Math.max(0, G.player.hp)/G.player.maxHp*100;
  if(fill) fill.style.width=pct+'%';
  if(txt) txt.textContent=`${Math.max(0,G.player.hp)}/${G.player.maxHp}`;
  hud.classList.toggle('low-hp', G.player.hp>0 && G.player.hp/G.player.maxHp<=0.3);
}
function spawnDmgPop(text, anchorEl, extraClass){
  const arena=document.querySelector('.arena');
  if(!arena || !anchorEl) return;
  const aRect=arena.getBoundingClientRect();
  const eRect=anchorEl.getBoundingClientRect();
  const wrap=document.createElement('div');
  wrap.style.position='absolute';
  wrap.style.left=(eRect.left + eRect.width/2 - aRect.left)+'px';
  wrap.style.top=(eRect.top - aRect.top - 14)+'px';
  wrap.style.transform='translateX(-50%)';
  wrap.style.pointerEvents='none';
  const pop=document.createElement('div');
  pop.className='dmg-pop pixel'+(extraClass?(' '+extraClass):'');
  pop.textContent=text;
  wrap.appendChild(pop);
  arena.appendChild(wrap);
  setTimeout(()=>wrap.remove(),800);
}
function spawnHitFlash(anchorEl){
  if(!anchorEl) return;
  const slot=anchorEl.closest('.soso-slot')||anchorEl.parentElement;
  if(!slot) return;
  const flash=document.createElement('div');
  flash.className='hit-flash';
  slot.appendChild(flash);
  setTimeout(()=>flash.remove(),350);
}
function animateAttack(dmg, crit){
  SND.sfxImpactLight();
  const frame=document.getElementById('monsterFrame');
  frame.classList.add('shake');
  setTimeout(()=>frame.classList.remove('shake'),300);
  spawnDmgPop((crit?'CRIT! ':'')+'(-'+dmg+')', frame);
  const cv=document.getElementById('sosoCanvas');
  if(cv){ cv.classList.add('soso-pose-attack'); setTimeout(()=>cv.classList.remove('soso-pose-attack'),400); }
}
function animateHit(dmg, negated){
  if(!negated) SND.sfxImpactHeavy();
  const cv=document.getElementById('sosoCanvas');
  if(cv){
    cv.classList.add('soso-pose-hit');
    setTimeout(()=>cv.classList.remove('soso-pose-hit'),400);
    if(!negated) spawnHitFlash(cv);
  }
  spawnDmgPop(negated?'BLOCK!':'(-'+dmg+')', cv, negated?'miss':'');
}
function onMonsterDefeated(){
  SND.sfxVictory();
  const b=G.battle;
  G.progress[G.act].kills = (G.progress[G.act].kills||0)+1;
  const frame=document.getElementById('monsterFrame');
  if(frame) frame.classList.add('dying');
  const cv=document.getElementById('sosoCanvas');
  if(cv) cv.classList.add('soso-pose-victory');
  if(hasItem('heal_on_win')){
    G.player.hp=Math.min(G.player.maxHp, G.player.hp+itemSum('heal_on_win'));
    updatePlayerHud();
  }
  setTimeout(()=>{
    showPanel({
      title:`🎉 ${b.monster.name} 처치!`,
      desc:'승리했습니다.',
      buttons:[{label:'계속', cls:'panel-btn', onClick:()=>{ closePanel(); const cb=b.onWin; G.battle=null; cb(); }}]
    });
  },700);
}
function handleDefeatCheck(){
  if(!G.revived && hasItem('revive')){
    G.revived=true;
    const rIdx = G.items.findIndex(i=>i.type==='revive');
    if(rIdx>=0) G.items.splice(rIdx,1);
    G.player.hp = Math.round(G.player.maxHp*0.5);
    toast('🔄 재입사 제안서 발동! 부활했습니다');
    nextQuestion();
    return;
  }
  clearInterval(G.battle.timer);
  SND.sfxDefeat();
  const gbtns = [
    {label:'처음부터', cls:'panel-btn danger', onClick:()=>{ closePanel(); newGame(); renderTitle(); }},
    {label:'📮 행사 소식 받기', cls:'panel-btn secondary', onClick:()=>{
      closePanel();
      openLeadForm({
        title:'📮 다음엔 오프라인에서',
        lead:'HR 실무자 네트워킹 행사와 세미나 소식을<br>가장 먼저 받아보세요.',
        cta:'신청하기',
        source:'game_over',
        onDone: ()=>{ newGame(); renderTitle(); }
      });
    }}
  ];
  showPanel({
    title:'💀 소소, 쓰러지다',
    desc:'HR 괴물들에게 패배했습니다.<br>다시 도전해볼까요?',
    buttons:gbtns
  });
}

async function sendLead(payload){
  if(!GTI.endpoint){
    try{
      const box = JSON.parse(localStorage.getItem(GTI.storeKey+'_rows') || '[]');
      box.push(payload);
      localStorage.setItem(GTI.storeKey+'_rows', JSON.stringify(box));
    }catch(e){}
    console.warn('[GTI] endpoint 미설정 — 브라우저에만 임시 저장되었습니다.', payload);
    return true;
  }
  await fetch(GTI.endpoint, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return true;
}

                                    return showErr('연락처를 010-1234-5678 형식으로 입력해 주세요.', 'ld_phone');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))
                                    return showErr('이메일 주소를 정확히 입력해 주세요.', 'ld_email');
    if(!$('ld_privacy').checked)    return showErr('개인정보 수집·이용(필수)에 동의해 주세요.');

    const btn = $('ld_submit');
    btn.disabled = true; btn.textContent = '전송 중...';
    const payload = {
      company, name, phone, email,
      agreePrivacy: 'Y',
      agreeMarketing: $('ld_mkt').checked ? 'Y' : 'N',
      source,
      act: (typeof G !== 'undefined' && G.act) ? G.act : '',
      submittedAt: new Date().toISOString()
    };
    try{
      await sendLead(payload);
      closePanel();
      showPanel({
        title:'✅ 신청 완료',
        desc:`${name}님, 신청해 주셔서 감사합니다.<br>${GTI.org}의 네트워킹 행사 소식을<br>입력하신 이메일로 보내드릴게요.`,
        buttons:[{label:'계속하기', cls:'panel-btn', onClick:()=>{ closePanel(); if(onDone) onDone(); }}]
      });
    }catch(err){
      btn.disabled = false; btn.textContent = cta;
      showErr('전송에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    }
  };

  setTimeout(()=>{ const c=$('ld_company'); if(c) c.focus({preventScroll:true}); }, 120);
}

/* =========================================================
   시작
   ========================================================= */
document.getElementById('soundToggleBtn').onclick=()=>{
  SND.ensureCtx();
  const nowMuted = !SND.isMuted();
  SND.setMuted(nowMuted);
  const btn=document.getElementById('soundToggleBtn');
  btn.textContent = nowMuted?'🔇':'🔊';
  btn.classList.toggle('muted', nowMuted);
};
newGame();
renderTitle();
</script>
